<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Das Rätsel vom Möwenturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lexend:wght@400;500;700&family=Special+Elite&display=swap">
<style>
/* Layout: Nachtmeer als Bühne, darauf eine Fallakte aus Papier. Bewusst nur ein (Nacht-)Look. */
:root{
  --sea:#0d2433; --sea-deep:#081822; --beam:#ffd34d; --paper:#f3ead3; --ink:#1f2a33;
  --stamp:#b8352b; --ok:#2e7d4f; --muted:#5b6a73; --line:#d8ccad; --foam:#cfe3ea;
  --f-display:"Alfa Slab One",Georgia,serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-type:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea-deep);color:var(--foam);font-family:var(--f-body);font-size:18px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -10%,#1d4258 0%,var(--sea) 45%,var(--sea-deep) 100%);background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font-family:var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--beam);outline-offset:3px}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-type);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--beam)}
.bar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{background:transparent;border:2px solid #2d5368;color:var(--foam);border-radius:999px;padding:8px 16px;font-size:16px}
.ghost:active{background:#163646}
.stars-total{font-family:var(--f-type);color:var(--beam);font-size:16px}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:36px 22px 28px;background:linear-gradient(180deg,#0b1d29,#12344a);min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.beam{position:absolute;top:58px;right:74px;width:900px;height:900px;transform-origin:0 0;background:conic-gradient(from 0deg at 0 0,rgba(255,211,77,.28) 0deg,rgba(255,211,77,0) 18deg,rgba(255,211,77,0) 360deg);animation:sweep 7s linear infinite;pointer-events:none}
@keyframes sweep{from{transform:rotate(80deg)}to{transform:rotate(440deg)}}
.tower{position:absolute;right:52px;top:40px;width:44px}
.hero h1{font-size:clamp(34px,8vw,54px);line-height:1.05;color:var(--paper);position:relative;max-width:12ch}
.hero p{margin:0;color:var(--foam);position:relative;max-width:min(42ch,calc(100% - 70px))}
.stamp + .label{padding-right:100px}
.big{background:var(--beam);color:var(--ink);border:none;border-radius:14px;padding:16px 26px;font-size:20px;font-weight:700;box-shadow:0 5px 0 #b38f1f;position:relative;align-self:flex-start}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b38f1f}
.big:disabled{opacity:.45;cursor:default}
.namebox{display:flex;flex-direction:column;gap:8px;position:relative}
.namebox label{font-family:var(--f-type);font-size:15px;letter-spacing:.08em;color:var(--beam);text-transform:uppercase}
.namebox input{font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #2d5368;background:#0a1b26;color:var(--paper);max-width:320px}

.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ch{display:flex;gap:14px;align-items:center;text-align:left;background:#10303f;border:2px solid #23495c;border-radius:16px;padding:16px;color:var(--foam)}
.ch:not(:disabled):active{background:#163e51}
.ch:disabled{opacity:.45;cursor:default}
.ch-num{font-family:var(--f-display);font-size:30px;color:var(--beam);min-width:40px;text-align:center}
.ch-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.ch-title{font-weight:700;font-size:18px;color:var(--paper)}
.ch-meta{font-family:var(--f-type);font-size:14px;color:#9bb7c3}

.file{background:var(--paper);color:var(--ink);border-radius:6px 18px 18px 18px;padding:24px 20px;box-shadow:0 14px 30px rgba(0,0,0,.35);position:relative;display:flex;flex-direction:column;gap:14px}
.file::before{content:"";position:absolute;top:-14px;left:0;width:140px;height:16px;background:var(--paper);border-radius:8px 8px 0 0}
.label{font-family:var(--f-type);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.file h2{font-size:clamp(24px,5.5vw,32px);color:var(--ink);line-height:1.15;padding-right:90px}
.file p{margin:0;max-width:62ch}
.speech{border-left:4px solid var(--line);padding-left:14px}
.question{font-weight:700;font-size:20px;background:#fff8e3;border:2px dashed var(--line);border-radius:12px;padding:14px 16px}
.stamp{position:absolute;top:16px;right:16px;font-family:var(--f-type);color:var(--stamp);border:3px solid var(--stamp);padding:2px 10px;border-radius:6px;transform:rotate(8deg);font-size:15px;letter-spacing:.1em;opacity:.85}
.mirror{font-family:var(--f-display);font-size:clamp(34px,9vw,52px);text-align:center;transform:scaleX(-1);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;letter-spacing:.06em}
.code{font-family:var(--f-type);font-size:24px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;letter-spacing:.08em}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;font-family:var(--f-type);font-size:14px;text-align:center}
.abc span{background:#fff8e3;border-radius:6px;padding:4px 0}

.answer-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.display{font-family:var(--f-display);font-size:40px;min-width:150px;height:68px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--ink);border-radius:14px;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 14px}
.display.empty{color:#c4b994}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;width:100%}
.key{font-size:28px;font-weight:700;padding:14px 0;border-radius:14px;border:none;background:#e3d6b4;color:var(--ink);box-shadow:0 4px 0 #bfae86}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #bfae86}
.key:disabled{opacity:.5}
.key.del{background:#d9c9a3;font-size:20px}
.key.go{background:var(--ink);color:var(--beam);font-size:20px;box-shadow:0 4px 0 #000}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{font-size:20px;font-weight:700;padding:18px 10px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.choice:active{background:#fff3c4}
.choice.wrong{border-color:var(--stamp);color:var(--stamp);text-decoration:line-through}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.path{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.path:active{background:#fff3c4}
.path b{font-size:20px}
.path span{font-size:16px;color:var(--muted)}

.feedback{min-height:28px;font-weight:700}
.feedback.bad{color:var(--stamp)}
.feedback.good{color:var(--ok)}
.tries{font-family:var(--f-type);font-size:15px;color:var(--muted)}

/* Kampf */
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px}
.fighter{display:flex;flex-direction:column;gap:6px;min-width:0}
.fighter .who{font-family:var(--f-type);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#9bb7c3}
.hearts{font-size:26px;color:#e8564a;letter-spacing:3px}
.hearts i{font-style:normal;opacity:.2}
.foebar{display:flex;gap:4px}
.foebar span{flex:1;height:16px;border-radius:4px;background:var(--beam)}
.foebar span.gone{background:#3b4852}
.task{font-family:var(--f-display);font-size:clamp(36px,10vw,52px);color:var(--ink);font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.overlay{position:fixed;inset:0;background:rgba(4,12,18,.8);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.notebook{background:var(--paper);color:var(--ink);width:100%;max-width:640px;max-height:80%;overflow:auto;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;background-image:repeating-linear-gradient(180deg,transparent 0 33px,#d9e4ea 33px 34px)}
.notebook h2{font-size:26px}
.notebook ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-type);font-size:17px}
.notebook .empty{font-family:var(--f-type);color:var(--muted)}
.small{background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:500}

.cases{display:flex;flex-direction:column;gap:12px}
.case{display:flex;gap:16px;align-items:flex-start;text-align:left;background:#10303f;border:2px solid #23495c;border-radius:18px;padding:18px;color:var(--foam)}
.case:not(:disabled):active{background:#163e51}
.case:disabled{opacity:.5;cursor:default}
.case-badge{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:26px;color:var(--ink)}
.case-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.case-title{font-family:var(--f-display);font-size:22px;color:var(--paper);line-height:1.15}
.case-blurb{font-size:16px}
.case-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-type);font-size:14px;color:#9bb7c3}
.hint-name{margin:0;font-family:var(--f-type);color:var(--beam)}
.seq,.pile,.pic{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.qbox{width:44px;height:44px;border:3px dashed var(--stamp);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:var(--stamp);font-size:24px}
.share{display:flex;flex-direction:column;gap:8px}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dot2{width:13px;height:13px;border-radius:50%;background:#e0a91a;border:1.5px solid var(--ink);margin:1px}
.arrow{text-align:center;font-family:var(--f-type);color:var(--muted);font-size:15px}
.arrow::before{content:"↓ "}
.plates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pic svg{display:block}
.tokchoice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px}
.tokchoice span{font-size:15px}
.diffwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.diffwrap figure{margin:0;display:flex;flex-direction:column;gap:6px}
.diffgrid{display:grid;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px}
.diffgrid>*{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f7f1e1;border:2px solid transparent;padding:0;min-width:0}
.diffgrid svg{width:85%;height:85%}
.cellbtn{background:#fff8e3}
.cellbtn.wrong{border-color:var(--stamp)}
.cellbtn.right{border-color:var(--ok);background:#dff0e4}
.paintwrap{display:flex;justify-content:center;overflow-x:auto}
.paintgrid{display:grid;gap:3px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px}
.pc{width:34px;height:34px;border-radius:5px;border:1px solid var(--line);background:#fffdf6;padding:0}
.pc.on{background:var(--paintc);border-color:var(--ink)}
.pb{cursor:pointer;background:#fff8e3}
.axis{background:var(--stamp);border-radius:3px}
@media (max-width:380px){.pc{width:28px;height:28px}.paintgrid{grid-template-columns:repeat(4,28px) 6px repeat(4,28px)!important}}
.legend{font-family:var(--f-type);font-size:13px;color:var(--muted);text-align:center;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.lg-door{display:inline-block;width:18px;height:7px;border-radius:2px;background:#ee8a2b;border:1.5px solid var(--ink)}
.pathgrid{display:grid;gap:5px;background:#5b4a3a;border:3px solid var(--ink);border-radius:12px;padding:8px;max-width:420px;width:100%;align-self:center}
.pathbtn{aspect-ratio:1;border-radius:8px;border:2px solid #3b2f25;background:#d9b98a;color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:clamp(14px,4.2vw,19px);padding:0;min-width:0}
.pathbtn.start{background:#9ad08c}
.pathbtn.goal{background:var(--beam)}
.pathbtn.on{background:#fff3c4;outline:3px solid var(--ok);outline-offset:-3px}
.pathbtn.start.on{background:#9ad08c}
.pathbtn.bad{background:var(--stamp);color:#fff}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.cardbtn{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:16px;line-height:1.35}
.cardbtn svg{flex:none}
.cardbtn.sel{border-color:var(--ok);background:#e6f3e8}
.spbar{height:16px;background:#e3d6b4;border-radius:999px;overflow:hidden;border:2px solid var(--ink)}
.spfill{height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.spfill.low{background:var(--stamp)}
.spstat{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--f-type);font-size:15px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px 0}
.chip.hot{border-color:var(--stamp);color:var(--stamp)}
/* Gruselstimmung für dunkle Fälle */
body.mood-dark{background-color:#05090a;background-image:radial-gradient(ellipse at 50% -10%,#1d3b30 0%,#0a1613 48%,#05090a 100%)}
body.mood-dark::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(160,200,180,.10),transparent 70%) 10% 30%/60% 40% no-repeat,radial-gradient(closest-side,rgba(160,200,180,.08),transparent 70%) 80% 60%/70% 45% no-repeat,radial-gradient(closest-side,rgba(120,220,150,.10),transparent 70%) 60% 10%/30% 25% no-repeat;animation:fog 26s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-4%)}to{transform:translateX(5%)}}
body.mood-dark .wrap{position:relative;z-index:1}
body.mood-dark .brand{color:#8fe0a8}
body.mood-dark .file,body.mood-dark .file::before{background:#1b2226}
body.mood-dark .file{color:#dcd6c4;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px #2c3a36}
body.mood-dark .file h2{color:#eef5ea;text-shadow:0 0 18px rgba(120,220,150,.25)}
body.mood-dark .file .label,body.mood-dark .tries{color:#8aa39a}
body.mood-dark .speech{border-color:#3d5a4c}
body.mood-dark .feedback.good{color:#8fe0a8}
body.mood-dark .feedback.bad{color:#ff8f80}
body.mood-dark .stamp{color:#ff8f80;border-color:#ff8f80}
body.mood-dark .question{background:#24302c;border-color:#3d5a4c;color:#eef5ea}
body.mood-dark .ch{background:#121c19;border-color:#24372f}
body.mood-dark .ch-num{color:#8fe0a8}
body.mood-dark .spbar{background:#2c3a36;border-color:#8aa39a}
body.mood-dark .spfill{background:#5fd08a}
body.mood-dark .spstat{color:#eef5ea}
body.mood-dark .task{color:#ffffff;text-shadow:0 0 14px rgba(120,220,150,.35)}
body.mood-dark .arena{background:#0e1412;box-shadow:inset 0 0 0 1px #2c3a36}
body.mood-dark .arrow{color:#8aa39a}
body.mood-dark .small{color:#dcd6c4;border-color:#8aa39a}
@media (prefers-reduced-motion:reduce){body.mood-dark::before{animation:none}}
.certificate{text-align:center;align-items:center}
.certificate h2{padding-right:0}
.certificate .seal{font-family:var(--f-display);font-size:64px;color:var(--stamp);line-height:1}
.starline{font-size:30px;color:#c99a12;letter-spacing:4px}

@media (prefers-reduced-motion:reduce){.beam{animation:none;transform:rotate(150deg)}.shake{animation:none}}
</style>
</head>

const CHAPTERS = [
 { title:"Der Brief ohne Absender",
   outro:"Ben pfeift leise. „Wer auch immer den Kompass hat: Er kannte den Code. Und er hat etwas mit dem Leuchtturm zu tun.“ Mila nickt. „Morgen Abend gehen wir zum Möwenturm.“",
   nodes:{

    b1:{type:"battle", scene:"Möwen-Angriff!", text:"Kaum seid ihr am Strand, stürzen sich fünf Möwen auf Bens Fischbrötchen! Jede richtige Rechnung verscheucht eine Möwe. Jede falsche kostet ein Herz.", foe:"Möwen", hits:5, gen:"mul", tables:[3,4,5,6], hitLines:["Eine Möwe flattert kreischend davon!","Ben wedelt mit der Mütze. Treffer!","Die Möwe lässt das Brötchen fallen!","Weg ist sie!"], missLine:"Eine Möwe schnappt nach dem Brötchen!", win:"Die letzte Möwe gibt auf. Ben beißt triumphierend in sein Brötchen.", lose:"Die Möwen haben das Brötchen erwischt. Ben ist empört. Noch ein Versuch!", clue:"Am Strand gab es einen Kampf mit den Möwen. Gewonnen!", next:"b2"},
    b2:{type:"num", scene:"Spuren im Sand", text:"Im nassen Sand entdeckt Mila Abdrücke von Gummistiefeln. Sie führen Richtung Hafen. Ihr zählt 6 Abdrücke, und jeder hat 7 Rillen in der Sohle.", q:"Wie viele Rillen sind es zusammen?", answer:42, sol:"6 × 7 = 42", clue:"Gummistiefel-Spuren am Strand führen zum Hafen.", next:"p2"},
    t1:{type:"pick", scene:"Das Plakat", text:"An einer Hauswand hängt ein altes Plakat vom Museum. Jemand hat ein Wort in Spiegelschrift daraufgeschmiert.", mirror:"KOMPASS", q:"Welches Wort steht da?", options:["KAPITÄN","KOMPASS","KOFFER","KARTE"], answer:"KOMPASS", sol:"Das Wort heißt KOMPASS.", clue:"In der Altstadt hat jemand KOMPASS in Spiegelschrift an ein Plakat geschrieben.", next:"t2"},
    t2:{type:"num", scene:"Beim Bäcker", text:"Bäcker Jansen schiebt gerade Bleche aus dem Ofen. 9 Bleche, auf jedem 6 Brötchen.", say:"„Heute Nacht um drei hat einer an meine Hintertür geklopft und Brötchen gekauft. Er roch nach Fisch!“", q:"Wie viele Brötchen hat der Bäcker gebacken?", answer:54, sol:"9 × 6 = 54", clue:"Ein Mann, der nach Fisch roch, war nachts um drei beim Bäcker.", next:"p2"},
    p2:{type:"num", scene:"Im Museum", text:"Herr Lindqvist, der Museumswärter, öffnet aufgeregt die Tür.", say:"„Gut, dass ihr kommt! Ich habe den Brief geschrieben. Jede Nacht blinkt der Turm 6 Mal hintereinander, dann ist Pause. Das habe ich 4 Mal gezählt.“", q:"Wie oft hat das Licht insgesamt geblinkt?", answer:24, sol:"4 × 6 = 24", clue:"Das Licht blinkt in Gruppen von 6. Das sieht nach einem Signal aus.", next:"p3"},
    p3:{type:"num", scene:"Die Vitrine", text:"Herr Lindqvist führt euch zu einer leeren Vitrine. „Hier lag der alte Schiffskompass von Kapitän Hansen. Unser wertvollstes Stück!“ Die Vitrine hat ein Zahlenschloss mit drei Ziffern. Daneben liegt ein Zettel:", say:"1. Ziffer: 36 geteilt durch 9 · 2. Ziffer: 27 geteilt durch 3 · 3. Ziffer: 14 geteilt durch 7", q:"Wie lautet der Code? Tippe alle drei Ziffern hintereinander.", answer:492, sol:"36 : 9 = 4, 27 : 3 = 9, 14 : 7 = 2. Der Code ist 492.", clue:"Der Kompass von Kapitän Hansen fehlt. Der Dieb kannte den Code 492.", next:"p4"},
    p4:{type:"num", scene:"Die Symbole", text:"Auf der Rückseite des Zettels hat jemand mit Symbolen gerechnet:", say:"▲ + ▲ = 14   ·   ▲ × ● = 21", q:"Welche Zahl ist der Kreis ●?", answer:3, sol:"▲ ist 7, weil 7 + 7 = 14. Und 7 × 3 = 21, also ist ● die 3.", clue:"Auf dem Zettel standen geheime Symbol-Rechnungen.", next:"d2"},
    d2:{type:"decide", scene:"Und jetzt?", text:"Es ist schon Nachmittag. Ben gähnt, Mila ist hellwach.", q:"Was macht ihr als Nächstes?", options:[
      {label:"Heute Nacht den Turm beobachten", sub:"Mit Taschenlampe und Decke in den Dünen.", next:"n1"},
      {label:"Herrn Lindqvist ausfragen", sub:"Wer war gestern im Museum?", next:"q1"}]},
    n1:{type:"num", scene:"Nachtwache", text:"Ihr versteckt euch in den Dünen. Kurz nach Mitternacht beginnt der Turm zu blinken. Diesmal anders: 5 Gruppen mit je 8 Blinkern.", q:"Wie oft blinkt das Licht diesmal?", answer:40, sol:"5 × 8 = 40", clue:"Das Signal hat sich geändert: jetzt 5 Gruppen mit je 8 Blinkern.", next:"END"},
    q1:{type:"pick", scene:"Die Besucher", text:"Herr Lindqvist kratzt sich am Kopf. „Gestern waren drei Besucher da: Frau Olsen, Hafenmeister Brandt und Fischhändler Kai. Frau Olsen kam als Erste. Kai kam nach Brandt.“", q:"Wer war als Letzter im Museum, kurz vor Ladenschluss?", options:["Frau Olsen","Brandt","Kai"], answer:"Kai", sol:"Olsen war zuerst da. Kai kam nach Brandt. Also war Kai der Letzte.", clue:"Fischhändler Kai war gestern als Letzter im Museum.", next:"END"}
   }},
 { title:"Spuren am Leuchtturm",
   outro:"Mila zählt auf: „Fischgeruch, Fischschuppen, eine Fischgräte… Ich glaube, wir müssen mit ein paar Leuten am Hafen reden.“",
   nodes:{
    start:{type:"story", title:"Am Möwenturm", text:[
      "Es dämmert. Der Wind pfeift um den Möwenturm. Die Tür steht einen Spalt offen.",
      "Ben leuchtet mit der Taschenlampe auf den Boden. „Seht mal, Fußspuren im Sand. Und hier riecht es irgendwie… nach Fisch?“"], next:"p1"},
    p1:{type:"num", scene:"Die Fußspuren", text:"Die Spuren führen bis zur Tür. Ihr messt nach: Der Fremde hat 8 Schritte gemacht. Jeder Schritt ist genau 6 Pflastersteine lang.", q:"Wie viele Pflastersteine lang ist der Weg?", answer:48, sol:"8 × 6 = 48", clue:"Große Schritte! Der Fremde ist wohl ein Erwachsener.", next:"d1"},
    d1:{type:"decide", scene:"Die Tür klemmt", text:"Mila rüttelt an der Tür. Sie bewegt sich keinen Millimeter mehr. An der Außenwand führt eine rostige Leiter nach oben.", q:"Wie kommt ihr rein?", options:[
      {label:"Tür aufbrechen", sub:"Mit dem Zahlenschloss am Riegel.", next:"door"},
      {label:"Die Leiter hochklettern", sub:"Mutig, aber der Wind wird stärker.", next:"ladder"}]},
    door:{type:"num", scene:"Das Riegelschloss", text:"Am Riegel hängt ein Schloss. Auf einem Schild steht:", say:"Der Code ist die Zahl, die in der 8er-Reihe UND in der 9er-Reihe steht und kleiner als 100 ist.", q:"Wie lautet der Code?", answer:72, sol:"8 × 9 = 72. Die 72 steht in beiden Reihen.", clue:"Das Riegelschloss hatte den Code 72.", next:"stairs"},
    stairs:{type:"num", scene:"Die Treppe", text:"Drinnen geht es eine Wendeltreppe hoch. Sie hat 7 Etagen, und jede Etage hat 9 Stufen.", q:"Wie viele Stufen steigt ihr bis ganz nach oben?", answer:63, sol:"7 × 9 = 63", clue:"Auf jeder Stufe liegen glitzernde Fischschuppen.", next:"p2"},
    ladder:{type:"battle", scene:"Kletterpartie im Wind", text:"Auf halber Höhe frischt der Wind auf! Die Leiter wackelt. Jede richtige Rechnung bringt euch eine Sprosse höher.", foe:"Sturm", hits:5, gen:"mul", tables:[6,7,8], hitLines:["Eine Sprosse geschafft!","Mila zieht Ben hoch. Weiter!","Der Wind heult, aber ihr haltet fest!","Fast oben!"], missLine:"Eine Böe! Ihr rutscht eine Sprosse runter.", win:"Ihr schwingt euch durch das Fenster in den Laternenraum. Geschafft!", lose:"Der Wind ist zu stark. Ihr klettert vorsichtig wieder runter und versucht es nochmal.", clue:"Ihr seid die Außenleiter hochgeklettert. Oben im Fensterrahmen klebt eine Fischschuppe.", next:"p2"},
    p2:{type:"num", scene:"Die Laterne", text:"Oben im Laternenraum steht eine Kiste mit 40 Glühbirnen. Ein Zettel daran: „Gleichmäßig in 5 Reihen einschrauben.“", q:"Wie viele Glühbirnen kommen in jede Reihe?", answer:8, sol:"40 : 5 = 8", clue:"Jemand hat neue Glühbirnen eingesetzt. Der Turm wurde absichtlich wieder angeschaltet!", next:"p3"},
    p3:{type:"pick", scene:"Das Schaltpult", text:"Am Schaltpult leuchten vier Knöpfe mit Zahlen. Darunter steht: „Drücke den Knopf, der NICHT in die 6er-Reihe gehört. Dann geht das Licht aus.“", q:"Welchen Knopf drückt ihr?", options:["18","24","32","36"], answer:"32", sol:"18, 24 und 36 sind in der 6er-Reihe. 32 nicht.", clue:"Ihr habt das Licht am Schaltpult ausgeschaltet.", next:"p4"},
    p4:{type:"num", scene:"Das Fenster", text:"In die Fensterscheibe hat jemand Zahlen gekratzt. Sie werden immer kleiner:", say:"81 · 72 · 63 · ?", q:"Welche Zahl fehlt?", answer:54, sol:"Jedes Mal 9 weniger: 63 − 9 = 54.", clue:"Die 9er-Reihe rückwärts. Daneben ist eine kleine Fischgräte gekratzt.", next:"storm"},
    storm:{type:"battle", scene:"Das Gewitter", text:"Plötzlich zieht ein Gewitter auf! Die Fensterläden schlagen auf und zu. Schließt alle vier, bevor der Regen reinkommt. Jetzt wird geteilt!", foe:"Fensterläden", hits:4, gen:"div", tables:[4,5,6,7], hitLines:["Klack! Ein Laden ist zu.","Ben stemmt sich dagegen. Zu!","Noch einer geschafft!"], missLine:"Ein Laden knallt wieder auf! Regen spritzt rein.", win:"Alle Läden sind zu. Draußen tobt das Gewitter, drinnen ist es still.", lose:"Ihr seid klatschnass. Trocknet euch kurz ab und versucht es nochmal.", clue:"Ihr habt den Turm vor dem Gewitter gesichert.", next:"END"}
   }},
 { title:"Drei Verdächtige",
   outro:"Auf Kais Zettel steht: „Übergabe heute Nacht. Wenn der Turm blinkt, kommt das Boot.“ Mila springt auf. „Er hat einem Boot Zeichen gegeben!“",
   nodes:{
    start:{type:"story", title:"Am Hafen", text:[
      "Am nächsten Morgen ist am Hafen viel los. Drei Leute waren in der Nacht in der Nähe des Möwenturms.",
      "Ein guter Detektiv prüft jede Aussage nach. Auch die Zahlen!"], next:"d0"},
    d0:{type:"decide", scene:"Wie geht ihr vor?", text:"Ben will sofort losfragen. Mila möchte die Leute erst heimlich beobachten.", q:"Wie startet ihr?", options:[
      {label:"Heimlich beobachten", sub:"Hinter den Fischkisten verstecken.", next:"spy"},
      {label:"Direkt fragen", sub:"Freundlich, aber hartnäckig.", next:"p1"}]},
    spy:{type:"pick", scene:"Die Boote", text:"Vom Versteck aus seht ihr drei Boote: ein rotes, ein blaues und ein grünes. Das Boot von Kai ist nicht rot. Das blaue Boot gehört Frau Olsen.", q:"Welches Boot gehört Kai?", options:["Rot","Blau","Grün"], answer:"Grün", sol:"Blau gehört Olsen, rot ist es nicht. Also bleibt Grün.", clue:"Kai hat ein grünes Boot. Am Bug hängt eine Taschenlampe.", next:"p1"},
    p1:{type:"num", scene:"Hafenmeister Brandt", text:"Hafenmeister Brandt sitzt vor seinem Häuschen und flickt Netze.", say:"„Ich war die ganze Nacht hier. Ich habe 8 Netze geflickt, jedes hatte 9 Löcher.“", extra:"In seinem Notizbuch steht: Löcher geflickt: 72", q:"Wie viele Löcher hat er geflickt, wenn seine Aussage stimmt?", answer:72, sol:"8 × 9 = 72", clue:"Brandt: 8 Netze mit je 9 Löchern = 72. Passt zum Notizbuch.", next:"p2"},
    p2:{type:"num", scene:"Malerin Frau Olsen", text:"Frau Olsen malt am Kai. Sie hat Farbe an den Händen.", say:"„Ich habe die ganze Nacht gemalt. 4 Bilder, auf jedem 7 Möwen.“", extra:"Ihr zählt alle Möwen auf ihren Bildern: Es sind 28.", q:"Wie viele Möwen müssten es sein, wenn ihre Aussage stimmt?", answer:28, sol:"4 × 7 = 28", clue:"Frau Olsen: 4 Bilder mit je 7 Möwen = 28. Passt zu den Bildern.", next:"p3"},
    p3:{type:"num", scene:"Fischhändler Kai", text:"Fischhändler Kai stapelt nervös Kisten. Er riecht stark nach Fisch und trägt Gummistiefel.", say:"„Ich? Ich war die ganze Nacht im Laden! Ich habe 6 Kisten gepackt, in jeder 8 Fische. Das sind 56 Fische!“", q:"Wie viele Fische sind es wirklich?", answer:48, sol:"6 × 8 = 48. Kai hat sich verrechnet!", clue:"Kai behauptet 56 Fische, es sind aber nur 48!", next:"p4"},
    p4:{type:"pick", scene:"Wer flunkert?", text:"Mila schaut in eure Notizen. „Zwei Aussagen passen zu den Zahlen. Eine nicht.“", q:"Wer hat geflunkert?", options:["Brandt","Frau Olsen","Kai"], answer:"Kai", sol:"Nur bei Kai stimmt die Rechnung nicht.", clue:"Hauptverdächtiger: Fischhändler Kai.", next:"d1"},
    d1:{type:"decide", scene:"Kai haut ab!", text:"Kai wird blass, lässt eine Kiste fallen und rennt los!", q:"Was macht ihr?", options:[
      {label:"Hinterher!", sub:"Quer über den Fischmarkt.", next:"chase"},
      {label:"Seinen Laden durchsuchen", sub:"Vielleicht liegt da ein Beweis.", next:"shop"}]},
    chase:{type:"battle", scene:"Verfolgungsjagd!", text:"Kai rennt über den Fischmarkt, ihr hinterher! Jede richtige Rechnung bringt euch näher ran. Gemischte Aufgaben!", foe:"Kai", hits:5, gen:"mix", tables:[6,7,8,9], hitLines:["Ihr springt über eine Fischkiste!","Ben schlüpft unter einem Netz durch!","Ihr holt auf!","Nur noch ein paar Meter!"], missLine:"Ihr rutscht auf einer Fischschuppe aus!", win:"Kai bleibt keuchend stehen. Dabei fällt ihm ein Zettel aus der Tasche.", lose:"Kai ist um die Ecke verschwunden. Aber ihr kennt den Hafen. Noch mal!", clue:"Ihr habt Kai auf dem Fischmarkt eingeholt.", next:"alley"},
    alley:{type:"pick", scene:"Die Gasse", text:"Kai hat sich losgerissen und ist in eine Gasse gelaufen. Ein Fischer ruft: „Er ist in die Gasse mit der Nummer 6 mal 6!“", q:"In welche Gasse rennt ihr?", options:["32","36","42","63"], answer:"36", sol:"6 × 6 = 36", clue:"In Gasse 36 findet ihr Kais Zettel auf dem Boden.", next:"END"},
    shop:{type:"num", scene:"Im Kühlraum", text:"In Kais Laden ist es eiskalt. Im Kühlraum stehen 7 Regale mit je 8 Fischkisten. Aber eine Kiste fehlt!", q:"Wie viele Kisten stehen noch da?", answer:55, sol:"7 × 8 = 56. Eine fehlt, also 56 − 1 = 55.", clue:"In Kais Kühlraum fehlt eine Kiste.", next:"secret"},
    secret:{type:"pick", scene:"Die Geheimschrift", text:"Auf dem Tresen liegt ein Zettel mit Zahlen. Jede Zahl ist ein Buchstabe: A = 1, B = 2, C = 3 und so weiter.", code:"19 · 20 · 5 · 7", abc:true, q:"Welches Wort steht da?", options:["SAGE","STEG","SEGEL","SPUR"], answer:"STEG", sol:"S = 19, T = 20, E = 5, G = 7. Das Wort heißt STEG.", clue:"In Kais Laden stand das Wort STEG in Geheimschrift.", next:"END"}
   }},
 { title:"Das Lichtsignal",
   outro:"Am Abend leuchtet der Möwenturm ein letztes Mal. Herr Lindqvist hat ihn extra für euch angeschaltet. Ein Dankeschön für das Detektivbüro Leuchtfeuer.",
   nodes:{
    start:{type:"story", title:"Die Übergabe", text:[
      "Auf der Rückseite von Kais Zettel steht noch mehr:",
      "„Steg Nummer (9 mal 9) minus (8 mal 9).“",
      "Mila springt auf. „Wir müssen ihn aufhalten, bevor der Kompass die Bucht verlässt!“"], next:"p1"},
    p1:{type:"num", scene:"Der richtige Steg", text:"Am Hafen gibt es viele Stege. Kais Zettel sagt:", say:"Steg Nummer (9 mal 9) minus (8 mal 9)", q:"Zu welchem Steg müsst ihr?", answer:9, sol:"9 × 9 = 81 und 8 × 9 = 72. 81 − 72 = 9.", clue:"Die Übergabe soll an Steg 9 stattfinden.", next:"p2"},
    p2:{type:"num", scene:"Die Flut", text:"Der alte Fischer Jens am Steg brummt: „Das Boot kann erst anlegen, wenn das Wasser hoch genug ist. Jetzt fehlen noch 32 Zentimeter. Jede Stunde steigt das Wasser um 4 Zentimeter.“", q:"In wie vielen Stunden kann das Boot anlegen?", answer:8, sol:"32 : 4 = 8", clue:"Das Boot kommt erst in 8 Stunden.", next:"d1"},
    d1:{type:"decide", scene:"Acht Stunden", text:"Ihr habt Zeit. Ben will den Kompass suchen. Mila hat einen frechen Plan.", q:"Was macht ihr?", options:[
      {label:"Den Kompass suchen", sub:"Er muss hier irgendwo versteckt sein.", next:"search"},
      {label:"Das Boot reinlegen", sub:"Mit der Taschenlampe ein falsches Signal senden.", next:"morse"}]},
    search:{type:"num", scene:"Das Bootshaus", text:"Im Bootshaus an Steg 9 hängen 9 Rettungsringe in jeder Reihe. Es gibt 4 Reihen. Hinter einem davon klebt ein Zettel: „Kisten am Ende des Stegs.“", q:"Wie viele Rettungsringe hängen dort?", answer:36, sol:"4 × 9 = 36", clue:"Im Bootshaus: Der Kompass ist in einer Kiste am Ende des Stegs.", next:"boxes"},
    morse:{type:"num", scene:"Das falsche Signal", text:"Mila kennt Kais Lichtcode jetzt: Ein langes Leuchten zählt 5, ein kurzes zählt 1. Sie will dem Boot sagen: „Komm zu Steg 17.“ Dort wartet die Wasserpolizei.", say:"lang · lang · lang · kurz · kurz", q:"Welche Zahl sendet dieses Signal?", answer:17, sol:"5 + 5 + 5 + 1 + 1 = 17", clue:"Ihr habt dem Boot ein falsches Signal geschickt: Steg 17.", next:"boxes"},
    boxes:{type:"pick", scene:"Die Kisten", text:"Am Ende von Steg 9 stehen vier Kisten mit Nummern. Unter Kais Zettel steht klein: „Kompass in der Kiste, deren Zahl in der 4er-Reihe UND in der 6er-Reihe vorkommt.“", q:"Welche Kiste macht ihr auf?", options:["8","12","16","18"], answer:"12", sol:"12 ist in der 4er-Reihe (4, 8, 12) und in der 6er-Reihe (6, 12).", clue:"In Kiste 12 liegt der Kompass von Kapitän Hansen!", next:"final"},
    final:{type:"battle", scene:"Tauziehen am Steg", text:"Gerade als ihr die Kiste öffnet, taucht Kai auf und packt sie am anderen Ende! Jetzt zählt jede Rechnung: Wer zieht stärker?", foe:"Kai", hits:5, gen:"mix", tables:[6,7,8,9], hitLines:["Ihr zieht die Kiste ein Stück zu euch!","Ben stemmt die Füße in die Planken!","Kai kommt ins Rutschen!","Noch ein Ruck!"], missLine:"Kai zieht die Kiste zurück!", win:"Mit einem letzten Ruck plumpst Kai auf seinen Hosenboden. Die Kiste gehört euch! Kai gibt kleinlaut auf.", lose:"Kai hat die Kiste zurückgezogen. Aber ihr lasst nicht locker. Noch mal!", clue:"Tauziehen gewonnen! Der Kompass ist gerettet.", next:"p_end"},
    p_end:{type:"num", scene:"Zurück ins Museum", text:"Herr Lindqvist strahlt, als ihr den Kompass zurückbringt. „In 3 Wochen kommt der Kompass auf eine große Ausstellung. Bis dahin hängt euer Foto neben der Vitrine!“", q:"Eine Woche hat 7 Tage. Wie viele Tage sind 3 Wochen?", answer:21, sol:"3 × 7 = 21", clue:"Fall gelöst! In 21 Tagen geht der Kompass auf große Ausstellung.", next:"END"}
   }},

 { title:"Im Atelier",

    start:{type:"story", title:"Das bunte Atelier", text:[

      "Clown Pinsel-Paul jongliert mit Farbtöpfen. Bens kleine Cousine Lotta klebt Glitzer auf alles, was nicht wegläuft. Und Bäcker Jansen bringt die Torte in einem großen, flachen weißen Karton. Er stellt ihn neben die Staffelei."], next:"color1"},
    color1:{type:"pick", scene:"Die Malstunde", text:"Frau Olsen gibt jedem Kind ein Blatt. Ben will eine orange Sonne malen. Es gibt aber nur Rot, Gelb und Blau.", tokens:true, q:"Welche zwei Farben muss Ben mischen?", options:["mix:red+yellow","mix:blue+yellow","mix:red+blue"], answer:"mix:red+yellow", sol:"Rot und Gelb gemischt ergibt Orange.", clue:"Rot und Gelb ergibt Orange.", next:"color2"},

 { title:"Spuren in Farbe",

    sprinkles:{type:"num", scene:"Die Streusel", text:"Auf dem Boden liegen bunte Streusel. Frau Olsen sagt: „Die Herzchen-Streusel gibt es nur auf Jansens Torten!“", count:{"heart:pink":7,"circle:yellow":9,"star:blue":5,"square:green":6}, q:"Wie viele Herzchen-Streusel liegen da?", answer:7, sol:"Es sind 7 rosa Herzchen.", clue:"7 Herzchen-Streusel von Jansens Torte liegen genau vor der Staffelei.", next:"d1"},
    d1:{type:"decide", scene:"Zeugen befragen", text:"Zwei Gäste waren die ganze Zeit in der Nähe der Staffelei.", q:"Wen befragt ihr?", options:[

    clown:{type:"pick", scene:"Das Clown-Rätsel", text:"Pinsel-Paul wackelt mit seiner roten Nase. „Ich verrate euch was, aber nur, wenn ihr mein Rätsel löst!“", say:"„Es hat einen Kopf und einen Fuß, aber keine Beine. Was ist das?“", q:"Was meint der Clown?", options:["Ein Stuhl","Ein Bett","Eine Mütze","Ein Schuh"], answer:"Ein Bett", sol:"Ein Bett hat ein Kopfende und ein Fußende, aber keine Beine im Sinn von Menschenbeinen.", clue:"Clown Paul: „Der Bäcker ist mit einem flachen Karton gegangen. Der war ziemlich schwer für einen leeren Karton.“", next:"juggle"},
    juggle:{type:"num", scene:"Jonglieren", text:"Zum Dank jongliert Paul. Er hat 3 Bälle und wirft jeden 8 Mal hoch.", q:"Wie oft wirft Paul insgesamt?", answer:24, sol:"3 × 8 = 24", clue:"Paul hat 24 Mal geworfen und keinen Ball fallen lassen.", next:"who"},
    lotta:{type:"pick", scene:"Agentin Lotta", text:"Lotta flüstert nur in Zahlen. „A ist 1, B ist 2, und so weiter. Ich habe gesehen, wie jemand das hier weggetragen hat:“", code:"11 · 1 · 18 · 20 · 15 · 14", abc:true, q:"Was hat Lotta gesehen?", options:["KANTON","KARTON","KARTEN","KNOTEN"], answer:"KARTON", sol:"K = 11, A = 1, R = 18, T = 20, O = 15, N = 14. Das Wort heißt KARTON.", clue:"Lotta hat gesehen, wie jemand einen KARTON zur Tür getragen hat.", next:"glitter"},

    who:{type:"pick", scene:"Wer war es?", text:"Mila zählt auf: Clown Paul hatte die ganze Zeit beide Hände voller Ballons. Lotta ist viel zu klein für so einen großen Karton. Frau Olsen war in der Küche und hat Kakao gekocht.", q:"Wer hat den Karton mit dem Bild hinausgetragen?", options:["Clown Paul","Lotta","Frau Olsen","Bäcker Jansen"], answer:"Bäcker Jansen", sol:"Paul, Lotta und Frau Olsen können es nicht gewesen sein. Es bleibt Bäcker Jansen.", clue:"Bäcker Jansen hat den Karton mit dem Bild mitgenommen. Aus Versehen?", next:"END"}

 { title:"Wettlauf zur Bäckerei",

    bus:{type:"num", scene:"Die Busfahrt", text:"Der Bus hält an 6 Haltestellen, die Bäckerei ist die letzte. Von einer Haltestelle zur nächsten braucht er 3 Minuten. Ihr steigt an der ersten ein.", q:"Wie viele Minuten dauert die Fahrt bis zur letzten Haltestelle?", answer:15, sol:"Bei 6 Haltestellen gibt es nur 5 Strecken dazwischen. 5 × 3 = 15.", clue:"Die Busfahrt dauerte 15 Minuten. Knapp!", next:"stacks"},

    truck:{type:"battle", scene:"Das Altpapier-Auto!", text:"Da biegt schon das Altpapier-Auto um die Ecke! Dreht schnell die Kartons um. Jede richtige Rechnung ist ein Karton. Jetzt wird geteilt!", foe:"Altpapier-Auto", hits:5, gen:"div", tables:[3,4,5,6,7], hitLines:["Leer! Weiter!","Auch leer!","Nur Krümel!","Der nächste!"], missLine:"Das Auto kommt näher!", win:"Im letzten Karton glänzt etwas: Das ist Bens Bild!", lose:"Das Auto hupt. Der Fahrer wartet zum Glück kurz. Nochmal!", clue:"Ihr habt Bens Bild im letzten Karton gefunden.", next:"seagull"},

 { title:"Die Botschaft im Kompass",
   outro:"Morgen früh fahrt ihr zur Möweninsel. Beim Abschied bemerkt Ben eine Frau mit roter Mütze, die durchs Museumsfenster späht. Als er hinsieht, ist sie verschwunden.",
   nodes:{
    start:{type:"story", title:"Drei Wochen später", text:[
      "Ein paar Wochen sind vergangen. Morgen beginnt die große Ausstellung. Herr Lindqvist poliert den Kompass von Kapitän Hansen ein letztes Mal.",
      "Plötzlich macht es leise klick. Am Boden des Kompasses springt eine winzige Klappe auf. Darin steckt ein zusammengerolltes Papier, gelb und uralt.",
      "Am Hafen putzt Kai übrigens immer noch Fischkisten. Das ist seine Strafe. Er winkt euch verlegen zu."], next:"p1"},
    p1:{type:"num", scene:"Der Zettel im Kompass", text:"Mila rollt das Papier vorsichtig auf. Es ist Kapitän Hansens Handschrift.", say:"„Mein Schatz liegt auf der Möweninsel. Zähle die Felsen am Strand: 9 Reihen zu je 7 Felsen.“", q:"Wie viele Felsen liegen am Strand?", answer:63, sol:"9 × 7 = 63", clue:"Kapitän Hansens Schatz liegt auf der Möweninsel. Am Strand liegen 63 Felsen.", next:"p2"},
    p2:{type:"num", pro:true, scene:"Das Logbuch", text:"Herr Lindqvist holt Hansens altes Logbuch aus dem Archiv. Auf dem Zettel stand auch: „Lies die allerletzte Seite.“ Das Logbuch hat 12 Kapitel mit je 4 Seiten.", q:"Welche Seitenzahl hat die allerletzte Seite?", answer:48, sol:"12 × 4 = 48. Rechne 10 × 4 = 40 und 2 × 4 = 8, zusammen 48.", clue:"Auf Seite 48 des Logbuchs steht Hansens Hinweis, in alter Seemannsschrift.", next:"d1"},
    d1:{type:"decide", scene:"Die alte Schrift", text:"Seite 48 ist in einer verschnörkelten Seemannsschrift geschrieben. Keiner von euch kann sie lesen.", q:"Wen fragt ihr um Hilfe?", options:[
      {label:"Bens Opa Hinnerk", sub:"Alter Seemann. Etwas grummelig, aber er kennt jede Schrift.", next:"opa1"},
      {label:"Die Stadtbibliothek", sub:"Dort gibt es Bücher über alte Schriften.", next:"lib1"}]},
    opa1:{type:"battle", scene:"Rechenduell mit Opa Hinnerk", text:"Opa Hinnerk zieht die Augenbrauen hoch. „Erst will ich sehen, ob ihr schnell im Kopf seid. So haben wir auf See trainiert!“", foe:"Opa Hinnerk", hits:5, gen:"mul", tables:[6,7,8,9], hitLines:["„Hm. Nicht schlecht.“","Opa nickt anerkennend.","„Das hätte ich in eurem Alter nicht so schnell gekonnt!“","Opa kratzt sich am Bart."], missLine:"„Haha! Daneben, Landratte!“", win:"Opa Hinnerk lacht laut. „Ihr seid echte Seeleute! Gebt her, das Logbuch.“", lose:"„Noch nicht seefest!“, brummt Opa. „Nochmal!“", clue:"Opa Hinnerk hat euch im Rechenduell getestet. Bestanden!", next:"opa2"},
    opa2:{type:"num", scene:"Opas Seekarte", text:"Opa liest vor: „Die Insel liegt 18 Seemeilen vor der Küste.“ Dann holt er seine Seekarte. „Mein altes Motorboot schafft 6 Seemeilen in einer Stunde.“", q:"Wie viele Stunden dauert die Fahrt zur Insel?", answer:3, sol:"18 : 6 = 3", clue:"Die Möweninsel ist 18 Seemeilen entfernt. Mit dem Motorboot sind das 3 Stunden.", next:"p3"},
    lib1:{type:"pick", scene:"In der Bibliothek", text:"Die Bibliothekarin Frau Krüger erkennt die Schrift sofort. „Das ist Seemannscode! Jede Zahl ist ein Buchstabe.“ Das wichtigste Wort auf Seite 48 lautet:", code:"9 · 14 · 19 · 5 · 12", abc:true, q:"Welches Wort steht da?", options:["NEBEL","INSEL","KESSEL","IGELN"], answer:"INSEL", sol:"I = 9, N = 14, S = 19, E = 5, L = 12. Das Wort heißt INSEL.", clue:"Im Logbuch steht in Seemannscode das Wort INSEL.", next:"lib2"},
    lib2:{type:"num", scene:"Das Buch über Inseln", text:"„Zur Möweninsel habe ich ein altes Buch“, sagt Frau Krüger. „Es steht im großen Regal. Das Regal hat 8 Bretter, auf jedem stehen 9 Bücher. Es ist das allerletzte Buch.“", q:"Das wievielte Buch ist es?", answer:72, sol:"8 × 9 = 72", clue:"Im Buch über die Möweninsel ist eine Karte mit einer Höhle eingezeichnet.", next:"p3"},
    p3:{type:"num", scene:"Die Zahlenmauer", text:"Unten auf Seite 48 hat Hansen eine Zahlenmauer gezeichnet. Jeder Stein ist so groß wie die beiden Steine darunter zusammen. Daneben steht: „Merk dir die Spitze!“", say:"Unterste Reihe: 6 · 9 · 8", q:"Welche Zahl steht ganz oben auf der Spitze?", answer:32, sol:"6 + 9 = 15 und 9 + 8 = 17. Oben: 15 + 17 = 32.", clue:"WICHTIG: Die Spitze von Hansens Zahlenmauer ist 32.", next:"END"}
   }},
 { title:"Überfahrt im Nebel",
   outro:"Durch den letzten Nebelfetzen seht ihr ein Schiff mit roten Segeln. Es ankert auf der anderen Seite der Insel. Mila flüstert: „Wir sind nicht die Einzigen, die den Schatz suchen.“",
   nodes:{
    start:{type:"story", title:"Am Hafen", text:[
      "Früh am Morgen. Über dem Wasser liegt Nebel. Kai schrubbt am Kai seine Kisten und schaut sich nervös um.",
      "„Psst!“, flüstert er. „Passt auf die Rote Möwe auf. Das ist eine Kapitänin mit roter Mütze. Sie wollte den Kompass damals haben. Ich sollte ihn ihr bringen.“"], next:"d1"},
    d1:{type:"decide", scene:"Wie kommt ihr hin?", text:"Zur Möweninsel gibt es zwei Möglichkeiten.", q:"Womit fahrt ihr?", options:[
      {label:"Mit der großen Fähre", sub:"Bequem und trocken. Aber viele fremde Leute an Bord.", next:"f1"},
      {label:"Mit Opas Ruderboot", sub:"Abenteuerlich. Und anstrengend.", next:"r1"}]},
    f1:{type:"num", scene:"Auf der Fähre", text:"Auf dem Deck stehen 8 Reihen Bänke. Auf jeder Bank sitzen 6 Leute. Dann steigt ihr drei noch dazu.", q:"Wie viele Leute sitzen jetzt auf dem Deck?", answer:51, sol:"8 × 6 = 48. Dazu kommt ihr drei: 48 + 3 = 51.", clue:"Auf der Fähre sitzen 51 Leute auf dem Deck.", next:"f2"},
    f2:{type:"pick", scene:"Die Fremden an Bord", text:"Drei Fremde fallen euch auf. Sie sitzen vorne, in der Mitte und hinten. Ein Mann trägt einen Hut. Eine Frau trägt eine rote Mütze. Ein Junge hat ein Fernglas. Ihr wisst: Der Mann mit Hut sitzt hinten. Die Frau mit der roten Mütze sitzt nicht vorne.", q:"Wo sitzt die Frau mit der roten Mütze?", options:["Vorne","Mitte","Hinten"], answer:"Mitte", sol:"Hinten sitzt der Mann mit Hut. Vorne sitzt sie nicht. Also bleibt die Mitte.", clue:"Auf der Fähre sitzt die Frau mit der roten Mütze in der Mitte. Ist das die Rote Möwe?", next:"fog"},
    r1:{type:"battle", scene:"Gegen die Wellen", text:"Draußen wird das Meer unruhig. Jede richtige Rechnung ist ein kräftiger Ruderschlag. Gemischte Aufgaben!", foe:"Wellen", hits:5, gen:"mix", tables:[6,7,8,9], hitLines:["Ein kräftiger Schlag!","Das Boot gleitet über die Welle!","Ben rudert wie ein Weltmeister!","Weiter so!"], missLine:"Eine Welle schwappt ins Boot!", win:"Das Meer wird ruhiger. Ihr seid weit draußen.", lose:"Die Wellen treiben euch zurück zum Ufer. Noch ein Anlauf!", clue:"Mit dem Ruderboot habt ihr die Wellen besiegt.", next:"r2"},
    r2:{type:"num", scene:"Ruderschläge", text:"Ben will wissen, wie viel er gerudert hat. Ihr seid 9 Minuten gerudert, und in jeder Minute macht ihr 8 Schläge.", q:"Wie viele Ruderschläge waren das?", answer:72, sol:"9 × 8 = 72", clue:"72 Ruderschläge! Bens Arme sind schwer wie Blei.", next:"fog"},
    fog:{type:"battle", scene:"Im Nebel", text:"Plötzlich wird der Nebel so dicht, dass ihr nichts mehr seht. Nur die Lichtsignale der Insel zeigen die Richtung. Jede richtige Rechnung lässt euch das nächste Signal erkennen. Jetzt wird geteilt!", foe:"Nebel", hits:4, gen:"div", tables:[6,7,8,9], hitLines:["Da! Ein Lichtsignal!","Die Richtung stimmt!","Der Nebel wird dünner!"], missLine:"Ihr habt euch im Nebel verfahren!", win:"Der Nebel reißt auf. Vor euch liegt die Möweninsel.", lose:"Ihr dreht im Nebel im Kreis. Wartet kurz und versucht es nochmal.", clue:"Ihr habt den Weg durch den Nebel gefunden.", next:"land"},
    land:{type:"num", pro:true, scene:"Ankunft", text:"Am Ufer der Möweninsel schaukeln 4 Bojen im Wasser. Auf jeder Boje sitzen 15 Möwen und schauen euch neugierig an.", q:"Wie viele Möwen sitzen auf den Bojen?", answer:60, sol:"4 × 15 = 60. Rechne 4 × 10 = 40 und 4 × 5 = 20, zusammen 60.", clue:"Auf der Möweninsel begrüßen euch 60 Möwen.", next:"END"}
   }},
 { title:"Die Höhle der Krebse",

   nodes:{
    start:{type:"story", title:"Auf der Möweninsel", text:[
      "Die Möweninsel ist klein, felsig und windig. Überall sind Möwen.",
      "Mila zieht Hansens Notizen hervor. „Wir müssen die Felsen zählen und die Höhle finden. Und zwar schneller als die Rote Möwe.“"], next:"p1"},
    p1:{type:"pick", scene:"Die Himmelsrichtungen", text:"Auf Hansens Karte steht: Das alte Leuchtfeuer liegt nördlich vom Strand. Der Brunnen liegt östlich vom Leuchtfeuer. Die Höhle liegt südlich vom Brunnen, auf gleicher Höhe wie der Strand.", q:"In welcher Richtung liegt die Höhle, vom Strand aus gesehen?", options:["Norden","Osten","Süden","Westen"], answer:"Osten", sol:"Vom Strand nach Norden, dann nach Osten, dann wieder nach Süden zurück. Am Ende steht ihr östlich vom Strand.", clue:"Die Höhle liegt östlich vom Strand.", next:"p2"},
    p2:{type:"num", scene:"Die Felsen", text:"Am Strand liegen die 63 Felsen aus Hansens Botschaft. Auf jedem 7. Felsen ist ein kleiner Anker eingeritzt.", q:"Auf wie vielen Felsen ist ein Anker?", answer:9, sol:"63 : 7 = 9", clue:"9 Felsen tragen einen Anker. Sie zeigen wie Pfeile zur Höhle.", next:"cavefloor"},

    doors:{type:"pick", scene:"Die drei Türen", text:"Am Ende des Gangs sind drei Türen. Auf jeder steht ein Satz. Hansen hat dazugeschrieben: „Nur EIN Satz ist wahr.“", say:"Tür 1: Der Weg ist nicht hinter mir. · Tür 2: Der Weg ist hinter mir. · Tür 3: Der Weg ist nicht hinter Tür 2.", q:"Hinter welcher Tür ist der Weg?", options:["Tür 1","Tür 2","Tür 3"], answer:"Tür 1", sol:"Wäre der Weg hinter Tür 2 oder 3, wären zwei Sätze wahr. Nur bei Tür 1 ist genau ein Satz wahr (der von Tür 3).", clue:"Ihr habt das Türen-Rätsel geknackt. Tür 1 war richtig.", next:"chest"},

 { title:"Die Rote Möwe",
   outro:"Zurück in Möwenbucht wartet schon die Wasserpolizei auf die Rote Möwe. Herr Lindqvist stellt Hansens Goldmünzen neben den Kompass in die Vitrine. Darunter hängt ein neues Schild: „Gefunden vom Detektivbüro Leuchtfeuer.“",
   nodes:{
    start:{type:"story", title:"Die Kapitänin", text:[
      "Als ihr aus der Höhle kommt, steht sie vor euch: eine große Frau mit roter Mütze und einem goldenen Ohrring. Die Rote Möwe!",
      "„Ihr habt die Karte gefunden“, sagt sie und lächelt schief. „Wie praktisch. Gebt sie her.“ Hinter ihr landen gerade ihre Boote am Strand."], next:"p1"},
    p1:{type:"num", scene:"Die Mannschaft", text:"Die Rote Möwe hat 3 Boote mitgebracht. In jedem Boot sitzen 6 Matrosen. Jeder Matrose trägt 2 Schaufeln.", q:"Wie viele Schaufeln haben sie dabei?", answer:36, sol:"3 × 6 = 18 Matrosen. 18 × 2 = 36 Schaufeln.", clue:"Die Rote Möwe hat 18 Matrosen mit 36 Schaufeln dabei. Sie will die ganze Insel umgraben.", next:"d1"},
    d1:{type:"decide", scene:"Was jetzt?", text:"Mila hält die Karte hinter dem Rücken fest. Ben schaut zu den Booten.", q:"Was macht ihr?", options:[
      {label:"Mila verhandelt", sub:"Die Rote Möwe liebt Rätsel. Vielleicht gibt es einen Handel.", next:"riddle"},
      {label:"Ben lenkt ab, ihr schleicht zum Boot", sub:"Riskant, aber schnell.", next:"sneak"}]},
    riddle:{type:"num", scene:"Das Rätselduell", text:"Die Rote Möwe grinst. „Ein Rätsel. Löst ihr es, lasse ich euch gehen. Wenn nicht, gehört die Karte mir.“", say:"„Ich bin eine Zahl. Nimmst du mich mal 6, bekommst du 54. Nimmst du mich mal 9, bekommst du 81.“", q:"Welche Zahl ist gemeint?", answer:9, sol:"6 × 9 = 54 und 9 × 9 = 81. Die Zahl ist 9.", clue:"Ihr habt das Rätselduell gewonnen. Die Rote Möwe ist wütend.", next:"p2"},
    sneak:{type:"battle", scene:"Leise zum Boot", text:"Ben ruft: „Da drüben glitzert etwas!“ Alle Matrosen drehen sich um. Jetzt schleicht ihr. Jede richtige Rechnung ist ein leiser Schritt.", foe:"Matrosen", hits:4, gen:"mul", tables:[6,7,8,9], hitLines:["Psst. Ein Schritt weiter.","Niemand hat euch gesehen.","Fast am Boot!"], missLine:"Knack! Ein Ast. Ein Matrose dreht sich um.", win:"Ihr erreicht das Boot. Die Matrosen suchen immer noch nach dem Glitzern.", lose:"Ein Matrose hat euch entdeckt! Ihr versteckt euch hinter einem Felsen und versucht es nochmal.", clue:"Ihr seid unbemerkt zum Boot geschlichen.", next:"p2"},
    p2:{type:"pick", scene:"Das Muster auf der Karte", text:"Im Boot schaut ihr euch die zweite Karte genau an. Neben dem roten Kreuz stehen Zahlen. Die letzte fehlt.", say:"3 · 6 · 12 · 24 · ?", q:"Welche Zahl fehlt?", options:["30","36","48","50"], answer:"48", sol:"Jede Zahl wird verdoppelt: 24 + 24 = 48.", clue:"48! Das ist die Hausnummer vom alten Leuchtturmwärterhaus am Möwenturm. Dort wohnt das Licht!", next:"race"},
    race:{type:"battle", scene:"Wettfahrt zum Hafen", text:"Die Rote Möwe hat gemerkt, dass ihr weg seid. Ihr Schiff jagt hinter euch her! Jede richtige Rechnung bringt euch näher an Möwenbucht.", foe:"Rote Möwe", hits:5, gen:"mix", tables:[6,7,8,9], hitLines:["Volle Fahrt voraus!","Der Abstand wird größer!","Da hinten ist schon der Möwenturm!","Die roten Segel werden kleiner!"], missLine:"Die Rote Möwe holt auf!", win:"Ihr erreicht den Hafen. Das Schiff der Roten Möwe läuft auf eine Sandbank und bleibt stecken.", lose:"Die Rote Möwe ist zu nah! Ihr weicht aus und versucht es nochmal.", clue:"Ihr habt die Wettfahrt gewonnen. Die Rote Möwe sitzt auf einer Sandbank fest.", next:"gold"},
    gold:{type:"num", pro:true, scene:"Der echte Schatz", text:"Im Keller des alten Leuchtturmwärterhauses, Hausnummer 48, findet ihr eine kleine Kiste. Darin liegen 8 Lederbeutel. In jedem Beutel sind 12 Goldmünzen.", q:"Wie viele Goldmünzen sind es zusammen?", answer:96, sol:"8 × 12 = 96. Rechne 8 × 10 = 80 und 8 × 2 = 16, zusammen 96.", clue:"Fall gelöst! 96 Goldmünzen von Kapitän Hansen sind gefunden.", next:"END"}
   }},

 /* ===== Fall 4: Die Goldene Möwe ===== */
 { title:"Der Festtag",
   outro:"Hinter den Kleiderständern im Kostümraum steht eine offene Kiste. Darin führt eine Leiter nach unten. Kowalski kratzt sich am Kopf: „Den Gang hab ich nicht gebaut. Der ist viel älter als die Bühne!“",
   nodes:{
    start:{type:"story", title:"Das Hafenfest", text:[
      "Ganz Möwenbucht feiert das große Hafenfest. Es gibt Zuckerwatte, ein Karussell und am Nachmittag das Drachenbootrennen.",
      "Auf der Festbühne steht in einer Glasvitrine der Siegerpokal: die Goldene Möwe.",
      "Um 15 Uhr kommt Bürgermeisterin Petersen angerannt. „Die Goldene Möwe ist weg! Und in zwei Stunden ist die Siegerehrung!“"], next:"lamp"},
    lamp:{type:"num", scene:"Die Lampions", text:"Über dem Festplatz hängen Lampionketten. Es sind 6 Ketten mit je 9 Lampions. Mila zählt nach, ob einer fehlt. Diebe nehmen manchmal Lampen mit, um im Dunkeln zu suchen.", q:"Wie viele Lampions müssten es sein?", answer:54, sol:"6 × 9 = 54", clue:"Alle 54 Lampions hängen noch. Der Dieb brauchte also kein Licht von hier.", next:"crowd"},
    crowd:{type:"path", scene:"Durchs Gedränge", text:"Auf dem Festplatz ist es proppenvoll. Die Festordner haben Nummernschilder aufgestellt. Nur wo ein Schild aus der 8er-Reihe steht, ist ein Durchgang frei. Tippe Feld für Feld einen Weg zur Bühne. Tippst du nochmal auf das letzte Feld, gehst du einen Schritt zurück.", grid:[[8,31,32,24,72,78],[72,15,80,41,64,56],[64,64,72,70,80,34],[47,72,22,16,24,46],[80,8,22,64,50,46],[18,64,23,40,24,16]], start:[0,0], goal:[5,5], rule:"m8", q:"Finde einen freien Weg zur Bühne.", clue:"Ihr seid durch das Gedränge bis zur Festbühne gekommen.", next:"d1"},
    d1:{type:"decide", scene:"Wo fangt ihr an?", text:"Der Festplatz ist voller Leute. Ihr müsst euch entscheiden.", q:"Wohin geht ihr zuerst?", options:[
      {label:"Zur Vitrine", sub:"Vielleicht hat der Dieb Spuren hinterlassen.", next:"vit"},
      {label:"Zum Bühnenbauer", sub:"Herr Kowalski hat die Bühne gebaut und kennt jede Schraube.", next:"kow"}]},
    vit:{type:"num", scene:"Konfetti an der Vitrine", text:"Rund um die leere Vitrine liegt buntes Konfetti. Mila sammelt nur das goldene Sternen-Konfetti ein.", count:{"star:yellow":6,"star:blue":4,"circle:red":7,"heart:pink":5,"square:green":5}, q:"Wie viele GOLDENE Sterne liegen da?", answer:6, sol:"Es sind 6 goldene Sterne. Die blauen zählen nicht.", clue:"BEWEIS: An der Vitrine lag goldenes Sternen-Konfetti.", next:"vit2"},
    vit2:{type:"pick", scene:"Die Vitrine", text:"Ihr untersucht die Vitrine. Das Schloss ist zu. Alle vier Glaswände sind heil. Der Deckel ist fest verschraubt.", q:"Wie ist der Dieb an den Pokal gekommen?", options:["Durch die Glaswand","Mit dem Schlüssel","Von unten","Durch den Deckel"], answer:"Von unten", sol:"Schloss, Wände und Deckel sind unversehrt. Bleibt nur der Weg von unten, durch die Bühne.", clue:"Der Dieb kam von unten an den Pokal, durch die Bühne.", next:"plan1"},
    kow:{type:"num", scene:"Bühnenbauer Kowalski", text:"Herr Kowalski wischt sich die Hände an der Latzhose ab. „Diese Bühne? Hab ich selbst gebaut. 8 Reihen mit je 7 Brettern, alles festgeschraubt.“", q:"Wie viele Bretter hat Kowalski verlegt?", answer:56, sol:"8 × 7 = 56", clue:"Kowalski hat die Bühne gebaut und hat den Bauplan dabei.", next:"plan1"},
    plan1:{type:"pick", tries:3, scene:"Der Bauplan", text:"Kowalski rollt den Bauplan der Festbühne aus. Jedes Kästchen ist ein Quadratmeter, die orangen Striche sind Türen. „Wer sich hier verstecken will“, sagt er, „nimmt einen Raum, der kleiner ist als das Lager, aber mehr als 10 Quadratmeter hat. Und der Raum liegt Wand an Wand mit der Werkstatt.“", art:"plan", plan:PLAN_STAGE, q:"In welchem Raum sucht ihr?", options:["A Bühne","B Backstage","C Garderobe","D Technik","E Lager","F Werkstatt","G Kostüme"], answer:"G Kostüme", sol:"Kleiner als das Lager (16) sind Backstage (10), Garderobe (12), Technik (10) und Kostüme (12). Mehr als 10 haben nur Garderobe und Kostüme. Wand an Wand mit der Werkstatt liegt nur der Kostümraum.", clue:"Im Kostümraum führt hinter den Kleiderständern eine Leiter nach unten.", next:"plan1b"},
    plan1b:{type:"num", tries:3, scene:"Komische Ecken", text:"Kowalski seufzt. „Backstage und Technik haben so komische Ecken. Die beiden Räume muss ich morgen neu streichen.“", art:"plan", plan:PLAN_STAGE, q:"Wie viele Quadratmeter haben Backstage und Technik zusammen?", answer:20, sol:"Backstage: 3 × 2 + 2 × 2 = 10. Technik: 1 × 2 + 4 × 2 = 10. Zusammen 20 Quadratmeter.", clue:"Kowalski muss 20 Quadratmeter streichen. Er kennt jeden Winkel der Bühne.", next:"END"}
   }},
 { title:"Unter der Bühne",
   outro:"Der Tunnel endet hinter der Bühne. Als ihr die Klappe aufdrückt, steht ihr mitten zwischen drei bunten Künstlerzelten.",
   nodes:{
    start:{type:"story", title:"Der alte Gang", text:[
      "Mit Taschenlampen klettert ihr hinunter. Der Gang ist niedrig und riecht nach altem Holz.",
      "Über euch hört ihr die Festmusik und die Schritte der Leute auf der Bühne."], next:"area"},
    area:{type:"num", scene:"Die Decke", text:"Über euch seht ihr die Unterseite der Bühne. Sie besteht aus Bodenplatten: 7 Platten lang und 5 Platten breit.", q:"Aus wie vielen Platten besteht die Decke?", answer:35, sol:"7 × 5 = 35", clue:"Die Bühne hat 35 Bodenplatten. Eine davon muss sich öffnen lassen.", next:"trap"},
    trap:{type:"pick", tries:3, scene:"Die Falltür", text:"Kowalski hat euch einen zweiten Plan mitgegeben: die Bühne von oben. Ein Scheinwerfer leuchtet immer auf das Feld direkt unter ihm. Kowalski erinnert sich an vier Dinge über die Vitrine: Sie stand in derselben Reihe wie das Mikrofon. Direkt über ihr hing ein Scheinwerfer. Sie stand nicht am Rand der Bühne. Und sie stand nicht direkt neben dem Mikrofon.", art:"stage", q:"Wo ist die Falltür, genau unter der Vitrine?", options:["A","B","C","D","E"], answer:"A", sol:"B steht direkt neben dem Mikrofon. C steht am Rand. Über D hängt kein Scheinwerfer. E steht in einer anderen Reihe als das Mikrofon. Nur A passt zu allen vier Hinweisen.", clue:"BEWEIS: Unter der Vitrine ist eine Falltür. Sie führt in den alten Tunnel.", next:"path1"},
    path1:{type:"path", scene:"Morsche Bretter", text:"Der Boden im Tunnel ist voller morscher Bretter. Nur die Bretter mit einer Zahl aus der 7er-Reihe halten. Tippe Feld für Feld einen Weg vom Start zum Ziel. Tippst du nochmal auf das letzte Feld, gehst du einen Schritt zurück.", grid:[[7,14,26,32,40],[12,21,30,27,45],[36,28,25,49,50],[44,56,63,70,34],[9,48,38,42,35]], start:[0,0], goal:[4,4], rule:"seven", q:"Finde einen sicheren Weg zum Ziel.", clue:"Auf den sicheren Brettern liegt goldenes Sternen-Konfetti. Der Dieb ist hier entlanggegangen.", next:"d1"},
    d1:{type:"decide", scene:"Die Gabelung", text:"Der Gang teilt sich. Links glitzert Konfetti auf dem Boden. Rechts scheint ein schwaches Licht.", q:"Welchen Weg nehmt ihr?", options:[
      {label:"Dem Konfetti folgen", sub:"Die Bretter dort wackeln bedenklich.", next:"wobble"},
      {label:"Dem Licht folgen", sub:"Dort hängt ein Kasten mit Schaltern.", next:"switch"}]},
    wobble:{type:"battle", scene:"Wackelige Bretter", text:"Die Bretter schwanken bei jedem Schritt! Jede richtige Rechnung ist ein sicherer Tritt. Gemischte Aufgaben!", foe:"Wackelbretter", hits:4, gen:"mix", tables:[6,7,8,9], hitLines:["Sicherer Tritt!","Das Brett hält!","Ben balanciert wie ein Seiltänzer!"], missLine:"Knarz! Ihr rutscht zurück.", win:"Ihr erreicht festen Boden. Vor euch ist eine Holzklappe.", lose:"Ihr seid zurück auf festem Boden gerutscht. Nochmal!", clue:"Ihr seid über die wackeligen Bretter balanciert.", next:"END"},
    switch:{type:"pick", tokens:true, scene:"Der Schalterkasten", text:"Am Ende des Gangs ist eine Klappe, die nur mit dem richtigen Schalter aufgeht. Die vier Schalter hängen nebeneinander, von links: Blau, Gelb, Rot, Grün. Auf einem Zettel steht: „Der richtige Schalter hängt nicht ganz links. Er hängt nicht neben dem gelben. Er ist nicht gelb.“", q:"Welchen Schalter drückt ihr?", options:["blob:blue","blob:yellow","blob:red","blob:green"], answer:"blob:green", sol:"Blau hängt ganz links. Rot hängt neben Gelb. Gelb ist ausgeschlossen. Es bleibt Grün.", clue:"Der grüne Schalter hat die Klappe am Tunnelende geöffnet.", next:"END"}
   }},
 { title:"Drei Künstler",
   outro:"Mila klappt ihr Notizbuch zu. „Ich glaube, ich weiß, wer es war. Aber wir brauchen Beweise, die zusammenpassen.“",
   nodes:{
    start:{type:"story", title:"Die Künstlerzelte", text:[
      "Drei Künstler treten heute auf der Festbühne auf: Zauberer Zappo, Jongleurin Jule und Clown Pinsel-Paul, den ihr schon von Bens Geburtstag kennt.",
      "Alle drei konnten heute in den Tunnel. Wer von ihnen war es?"], next:"tents"},
    tents:{type:"path", scene:"Zwischen den Zelten", text:"Zwischen den Zelten sind kreuz und quer Seile gespannt. Nur die Pflöcke mit einer Zahl aus der 9er-Reihe stehen fest, über die anderen stolpert ihr. Ihr startet oben rechts.", grid:[[20,17,9,26,27,9],[17,65,36,43,63,28],[18,29,81,18,9,53],[35,37,18,89,17,80],[9,90,54,71,76,74],[81,44,44,63,63,53]], start:[0,5], goal:[5,0], rule:"m9", q:"Finde den Weg zu den Künstlerzelten.", clue:"Ihr seid sicher bei den Künstlerzelten angekommen.", next:"times"},
    times:{type:"pick", tries:3, scene:"Der Auftrittsplan", text:"Jeder Künstler hatte heute genau einen Auftritt: um 14, um 15 oder um 16 Uhr. Am Zelt hängt ein zerrissener Plan. Ihr wisst nur: Jule ist nicht um 14 Uhr aufgetreten. Paul trat genau eine Stunde nach Jule auf.", q:"Wer stand um 15 Uhr auf der Bühne, als der Pokal verschwand?", options:["Zappo","Jule","Paul"], answer:"Jule", sol:"Paul kommt eine Stunde nach Jule. Wäre Jule um 16 Uhr dran, gäbe es danach keinen Termin mehr für Paul. Um 14 Uhr war Jule nicht dran. Also: Jule um 15, Paul um 16, Zappo um 14 Uhr.", clue:"BEWEIS: Jule stand um 15 Uhr auf der Bühne. Sie kann es nicht gewesen sein.", next:"cards"},
    cards:{type:"num", scene:"Zappos Kartentrick", text:"Vor seinem Zelt übt Zappo einen Kartentrick. Er verteilt die Karten gerecht an die Zuschauer.", share:{n:32,k:4,item:"card:red",group:"Zuschauer"}, q:"Wie viele Karten bekommt jeder Zuschauer?", answer:8, sol:"32 : 4 = 8", clue:"Zappo übt für seine große Abendshow.", next:"d1"},
    d1:{type:"decide", scene:"Die Zelte", text:"Zappo und Paul sind kurz weg. Ihr habt Zeit für ein Zelt.", q:"Welches Zelt durchsucht ihr?", options:[
      {label:"Zappos Zelt", sub:"Sternenmuster und ein großer Spiegel.", next:"zt"},
      {label:"Pauls Zelt", sub:"Bunt, voller Ballons und Hupen.", next:"pt"}]},
    zt:{type:"diff", scene:"Zappos Zaubertisch", text:"Auf Zappos Plakat ist sein Zaubertisch vom Morgen abgebildet. Vergleicht das Plakat (links) mit dem Tisch jetzt (rechts).", diff:{cols:5, before:["card:red","star:blue","card:red","circle:purple","tri:green","card:red","heart:red","star:purple","card:red","circle:blue","tri:purple","card:red","star:blue","heart:red","card:red","circle:green","card:red","tri:green","star:purple","card:red"], change:11, after:"card:red:gold"}, q:"Tippe im rechten Bild auf den Unterschied.", answer:"11", sol:"Auf einer der Karten klebt jetzt ein winziger goldener Stern.", clue:"BEWEIS: Nur Zappo benutzt goldenes Sternen-Konfetti in seiner Show.", next:"jule"},
    pt:{type:"pick", scene:"Pauls Zelt", text:"Paul hat einen Zettel an seinen Spiegel geklebt. „Den hab ich heute Mittag im Tunnel gefunden“, hat er zu Ben gesagt. „Ich dachte, das ist ein Scherz.“ Der Zettel ist in Spiegelschrift geschrieben.", mirror:"ZAUBERHUT", q:"Was steht auf dem Zettel?", options:["ZUCKERHUT","ZAUBERSTAB","ZAUBERHUT","ZAUNPFAHL"], answer:"ZAUBERHUT", sol:"Gespiegelt gelesen heißt es ZAUBERHUT.", clue:"BEWEIS: Im Tunnel lag ein Zettel mit dem Wort ZAUBERHUT. Paul trägt nur eine Clownsmütze, Zappo einen Zauberhut.", next:"jule"},
    jule:{type:"num", scene:"Jule jongliert", text:"Jule kommt vorbei und zeigt euch einen Trick. Sie jongliert mit 5 Bällen und wirft jeden Ball 7 Mal hoch, ohne dass einer herunterfällt.", q:"Wie oft wirft Jule insgesamt?", answer:35, sol:"5 × 7 = 35", clue:"Jule erzählt: Paul hatte den ganzen Tag beide Hände voller Ballons.", next:"END"}
   }},
 { title:"Die Beweiswand",
   outro:"Zappo gibt alles zu. Er wollte den Pokal in seiner Abendshow verschwinden und wieder auftauchen lassen, als größten Trick seines Lebens. Die Bürgermeisterin ist streng, aber gnädig: Nächstes Jahr darf Zappo den Trick zeigen, mit Erlaubnis. Und das Detektivbüro Leuchtfeuer sitzt in der ersten Reihe.",
   nodes:{
    start:{type:"story", title:"Halb fünf", text:[
      "Bürgermeisterin Petersen schaut auf die Uhr. „Halb fünf! In einer halben Stunde ist die Siegerehrung!“",
      "Ihr hängt alle Beweise an eine Wand im Festzelt. Jetzt muss alles zusammenpassen."], next:"combine"},
    combine:{type:"combine", tries:3, scene:"Die Beweiswand", text:"Sechs Hinweise hängen an der Wand. Nicht alle helfen weiter.", combine:{pick:3, answer:["konfetti","falltuer","nurzappo"], cards:[
      {id:"konfetti", icon:"star:yellow", text:"An der Vitrine und im Tunnel lag goldenes Sternen-Konfetti."},
      {id:"zucker", icon:"heart:pink", text:"Am Bühnengeländer klebte Zuckerwatte."},
      {id:"falltuer", icon:"square:brown", text:"Unter der Vitrine ist eine Falltür. Der Tunnel führt zu den Künstlerzelten."},
      {id:"ballons", icon:"balloon:red", text:"Paul hatte den ganzen Tag beide Hände voller Ballons."},
      {id:"nurzappo", icon:"tri:purple", text:"Nur Zappo benutzt goldenes Sternen-Konfetti in seiner Show."},
      {id:"lampions", icon:"circle:orange", text:"Alle 54 Lampions hängen noch."}]}, q:"Wähle die 3 Beweise, die zusammen zeigen, wer den Pokal genommen hat und wie.", sol:"Das goldene Konfetti lag am Tatort und im Tunnel. Nur Zappo benutzt dieses Konfetti. Und die Falltür erklärt, wie der Pokal aus der verschlossenen Vitrine kam.", clue:"Die Beweise zeigen auf Zauberer Zappo.", next:"route"},
    route:{type:"path", scene:"Quer über den Festplatz", text:"Zappo ist schon auf dem Weg zur Abendshow! Der schnellste Weg führt über den Festplatz. Ihr dürft nur über Stände gehen, deren Rechnung 24 ergibt.", grid:[["4×6","3×8","5×5","7×4"],["9×3","8×3","6×5","3×9"],["4×7","6×4","2×12","8×4"],["5×4","7×3","3×8","Ziel"]], start:[0,0], goal:[3,3], rule:"24", q:"Finde den Weg zur Bühne.", clue:"Ihr habt den schnellsten Weg über den Festplatz gefunden.", next:"show"},
    show:{type:"battle", scene:"Die große Zaubershow", text:"Zappo steht schon auf der Bühne und hebt den Zauberstab. Gleich lässt er den Pokal für immer verschwinden! Jede richtige Rechnung bringt euch einen Schritt näher.", foe:"Zappo", hits:5, gen:"mix", tables:[6,7,8,9], hitLines:["Durch die Zuschauer gedrängelt!","Die Bühnentreppe hoch!","Zappo zuckt zusammen!","Nur noch ein Schritt!"], missLine:"Eine Rauchwolke! Ihr seht nichts mehr.", win:"Ihr springt auf die Bühne. Zappo erschrickt so sehr, dass ihm der Zauberhut runterfällt. Heraus rollt die Goldene Möwe!", lose:"Der Rauch ist zu dicht. Wartet, bis er sich verzieht, und versucht es nochmal.", clue:"Die Goldene Möwe war in Zappos Zauberhut.", next:"back"},
    back:{type:"path", scene:"Zurück zur Siegerbühne", text:"Mit dem Pokal in der Hand müsst ihr quer über den Festplatz zur Siegerbühne. Diesmal sind nur die Stände frei, deren Rechnung 36 ergibt.", grid:[["6×6","5×7","8×4","9×4","6×7"],["4×9","9×3","12×3","6×6","4×9"],["9×4","3×12","6×6","7×5","9×4"],["6×6","4×8","4×9","6×5","3×12"],["9×4","12×3","5×8","7×4","Ziel"]], start:[0,0], goal:[4,4], rule:"e36", q:"Finde den Weg zur Siegerbühne.", clue:"Ihr habt die Goldene Möwe pünktlich zur Siegerbühne gebracht.", next:"prize"},
    prize:{type:"num", scene:"Die Siegerehrung", text:"Pünktlich um 17 Uhr überreicht die Bürgermeisterin die Goldene Möwe. Dazu verteilt sie Lose für die Tombola an die Ruderer des Siegerboots.", share:{n:45,k:9,item:"card:yellow",group:"Ruderer"}, q:"Wie viele Lose bekommt jeder Ruderer?", answer:5, sol:"45 : 9 = 5", clue:"Fall gelöst! Die Goldene Möwe ist zurück, und die Siegerehrung war pünktlich.", next:"END"}
   }},

 /* ===== Fall 5: Der Nebelkapitän ===== */
 { title:"Die Legende",
   outro:"Am Morgen prüft Svea alle Paddel. Mehrere sind angesägt. Auf dem Boden des Bootshauses glänzt eine Spur aus grünem Kerzenwachs. Ben schluckt. „Die grüne Laterne. Der Nebelkapitän war hier.“",
   nodes:{
    start:{type:"story", title:"Die Legende", text:[
      "Eine Woche nach dem Hafenfest wird das Drachenbootrennen nachgeholt. Diesmal rudert auch das Detektivbüro mit, im eigenen Boot: der „Leuchtfeuer“.",
      "Beim Abendtraining kriecht Nebel vom Meer herein. Trainerin Svea senkt die Stimme. „Kennt ihr die Legende vom Nebelkapitän? Vor hundert Jahren verschwand er beim Rennen im Nebel. Seitdem rudert er in der Nacht vor jedem Rennen mit einer grünen Laterne durch den Hafen. Und wessen Boot er berührt …“",
      "Sie macht eine Pause. „… das kommt nie im Ziel an.“ Ben lacht nervös. Niemand lacht mit."], next:"speed1"},
    speed1:{type:"speed", scene:"Trommeltakt", text:"Der Nebel wird dichter. Svea schlägt die Trommel, damit ihr den Weg zurück zum Steg findet. Bei jedem Schlag muss eine Rechnung sitzen. Du musst nicht auf Prüfen tippen: Sobald die Zahl stimmt, kommt die nächste Aufgabe.", speed:{secs:60, goal:10, tables:[7], setSize:6}, win:"Der Steg taucht aus dem Nebel auf. Geschafft! Doch draußen auf dem Wasser glimmt kurz ein grünes Licht.", lose:"Ihr treibt im Nebel. Svea trommelt lauter. Nochmal, schneller!", clue:"Erstes Training geschafft. Die 7er-Reihe wird schneller.", next:"bench"},
    bench:{type:"num", scene:"Das Drachenboot", text:"Ein Drachenboot hat 9 Bänke. Auf jeder Bank sitzen 2 Ruderer. Dazu kommen ein Trommler vorne und eine Steuerfrau hinten.", q:"Wie viele Leute sitzen im Boot?", answer:20, sol:"9 × 2 = 18 Ruderer. Dazu Trommler und Steuerfrau: 18 + 2 = 20.", clue:"In der Leuchtfeuer sitzen 20 Leute.", next:"d1"},
    d1:{type:"decide", scene:"Das Bootshaus", text:"Die Leuchtfeuer liegt über Nacht im alten Bootshaus. Das Holz knarrt, die Laternen am Kai flackern. Mila hat ein ungutes Gefühl.", q:"Was macht ihr?", options:[

    g+=[["A",2,2],["B",4,2],["C",0,2],["D",3,2],["E",3,1]].map(([l,x,y])=>`<circle cx="${x*U+U/2}" cy="${y*U+U/2}" r="14" fill="#fff" stroke="#1f2a33" stroke-width="2"/><text x="${x*U+U/2}" y="${y*U+U/2+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2a33">${l}</text>`).join("");

  pot:()=>{const c=50,cells=[];
    for(let y=0;y<5;y++)for(let x=0;x<5;x++)cells.push(`<rect x="${x*c+2}" y="${y*c+2}" width="${c-4}" height="${c-4}" rx="6" fill="#fff8e3" stroke="#d8ccad" stroke-width="2"/>`);

  try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); return Object.assign({name:"",stars:{},clues:[],pos:{},done:{},facts:{}},s);}}catch(e){}
  return {name:"",stars:{},clues:[],pos:{},done:{},facts:{}};
}

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function award(stars,clue){

  S.stars[k]=Math.max(S.stars[k]||0,stars);

     <div class="answer-row"><button class="key go" id="combcheck" style="padding:14px 28px" disabled>Prüfen</button><span class="tries" id="selcount">${view.sel.length} von ${n.combine.pick} gewählt</span><span class="tries" id="tries">${limit} Versuche</span></div>`;

    app.querySelectorAll(".pb").forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=+b.dataset.c;view.paint[r][c]^=1;b.classList.toggle("on");b.setAttribute("aria-pressed",!!view.paint[r][c]);document.getElementById("fb").textContent="";});

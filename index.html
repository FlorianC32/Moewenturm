function ruleOk(rule,v){
  if(rule==="seven") rule="m7"; if(rule==="24") rule="e24";
  if(rule[0]==="m"){const k=+rule.slice(1);return typeof v==="number"&&v%k===0&&v<=10*k;}
  if(rule[0]==="e"){const m=/^(\d+)×(\d+)$/.exec(v);return !!m&&m[1]*m[2]===+rule.slice(1);}
  return false;
}
function walkable(n,r,c){return (r===n.goal[0]&&c===n.goal[1])||(r===n.start[0]&&c===n.start[1])||ruleOk(n.rule,n.grid[r][c]);}
function solvePath(n){const R=n.grid.length,C=n.grid[0].length,prev={},q=[n.start],k=(a)=>a.join(",");prev[k(n.start)]=null;
  while(q.length){const cur=q.shift();if(cur[0]===n.goal[0]&&cur[1]===n.goal[1])break;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=cur[0]+dr,nc=cur[1]+dc;if(nr<0||nc<0||nr>=R||nc>=C||k([nr,nc]) in prev||!walkable(n,nr,nc))continue;prev[k([nr,nc])]=cur;q.push([nr,nc]);}}
  const path=[];let c=n.goal;while(c){path.unshift(c);c=prev[k(c)];}return path;}
function paintPath(){app.querySelectorAll(".pathbtn").forEach(b=>b.classList.toggle("on",view.path.some(([a,c])=>a===+b.dataset.r&&c===+b.dataset.c)));}
function bindPath(n,limit){
  const fb=()=>document.getElementById("fb");
  document.getElementById("pathreset").onclick=()=>{view.path=[n.start];paintPath();fb().textContent="";};
  app.querySelectorAll(".pathbtn").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r,c=+b.dataset.c,last=view.path[view.path.length-1];
    if(last[0]===r&&last[1]===c){ if(view.path.length>1){view.path.pop();paintPath();} return; }
    if(view.path.some(([a,d])=>a===r&&d===c)) return;
    if(Math.abs(last[0]-r)+Math.abs(last[1]-c)!==1){fb().className="feedback bad";fb().textContent="Du kannst nur auf ein Nachbarfeld gehen.";return;}
    if(!walkable(n,r,c)){
      view.tries++; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),700);
      if(view.tries>=limit){award(0,n.clue);view.path=solvePath(n);paintPath();
        finishPuzzle(`Mila zeigt dir den Weg. Diesmal gibt es keinen Stern.<br><span style="font-weight:500">Notiz: ${esc(n.clue)}</span>`,"bad",n);return;}
      view.path=[n.start];paintPath();const left=limit-view.tries;
      fb().className="feedback bad";fb().textContent=`Plumps! Das Feld hält nicht. Zurück zum Start. Noch ${left} ${left===1?"Versuch":"Versuche"}.`;
      document.getElementById("tries").textContent=`${left} ${left===1?"Versuch":"Versuche"}`;return;}
    view.path.push([r,c]);paintPath();fb().textContent="";
    if(r===n.goal[0]&&c===n.goal[1]){const stars=[3,2,1][view.tries]||1;award(stars,n.clue);
      finishPuzzle(`${rnd(praise)} ${"★".repeat(stars)}<br><span style="font-weight:500">Notiz: ${esc(n.clue)}</span>`,"good",n);}
  });
}

function press(k){
  const d=document.getElementById("disp"); if(!d||document.querySelector(".key:disabled")) return;
  if(k==="ok"){ if(!entry) return; return node().type==="battle"?battleAnswer(entry):check(entry); }
  if(k==="del") entry=entry.slice(0,-1); else if(entry.length<4) entry+=k;
  d.textContent=entry||"?"; d.classList.toggle("empty",!entry);
}

document.addEventListener("keydown",e=>{
  if(view.sp&&view.sp.state==="run"&&!document.querySelector(".overlay")){ if(/^[0-9]$/.test(e.key)) spPress(e.key); else if(e.key==="Backspace") spPress("del"); return; }
  if(view.screen!=="node"||document.querySelector(".overlay")||!document.getElementById("disp")) return;
  if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Enter") press("ok");
});

const praise=["Stark kombiniert!","Genau richtig!","Messerscharf!","Volltreffer, Detektiv!","So macht man das!"];

function finishPuzzle(fbHtml,cls,n){
  const fb=document.getElementById("fb"); fb.className="feedback "+cls; fb.innerHTML=fbHtml;
  app.querySelectorAll(".key,.choice,.cellbtn,.pb,.pathbtn,.cardbtn,#pathreset,#combcheck,#paintcheck").forEach(b=>b.disabled=true);
  const next=document.createElement("button"); next.className="big"; next.textContent="Weiter";
  next.onclick=()=>go(n.next); fb.after(next); next.focus();
}

function check(val,btn){
  const n=node(), limit=n.tries||(n.type==="pick"?2:3);
  if(String(val)===String(n.type==="paint"||n.type==="combine"?"ok":n.answer)){
    const stars=[3,2,1][view.tries]||1;
    award(stars,n.clue);
    finishPuzzle(`${rnd(praise)} ${"★".repeat(stars)}<br><span style="font-weight:500">Notiz: ${esc(n.clue)}</span>`,"good",n);
    return;
  }
  view.tries++;
  if(btn) btn.classList.add("wrong");
  entry=""; const d=document.getElementById("disp"); if(d){d.textContent="?";d.classList.add("empty");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");}
  if(view.tries>=limit){
    award(0,n.clue);
    if(n.type==="paint"){const tgt=paintTarget(n.paint.left);app.querySelectorAll(".pb").forEach(b=>b.classList.toggle("on",tgt[+b.dataset.r][+b.dataset.c]==="1"));}
    if(n.type==="combine"){app.querySelectorAll(".cardbtn").forEach(b=>b.classList.toggle("sel",n.combine.answer.includes(b.dataset.id)));}
    if(n.type==="diff"){const c=app.querySelector(`[data-cell="${n.answer}"]`);c&&c.classList.add("right");}
    finishPuzzle(`Mila hat nachgerechnet: ${esc(n.sol)}<br><span style="font-weight:500">Diesmal gibt es keinen Stern. Notiz: ${esc(n.clue)}</span>`,"bad",n);
    return;
  }
  const left=limit-view.tries;
  document.getElementById("fb").className="feedback bad";
  document.getElementById("fb").textContent=`Leider falsch. Noch ${left} ${left===1?"Versuch":"Versuche"}.`;
  const t=document.getElementById("tries"); if(t) t.textContent=`${left} ${left===1?"Versuch":"Versuche"}`;
}

/* Speed-Runden mit Merkliste (Wiederholung schwieriger Aufgaben) */
const CORE=["6×7","6×8","7×7","7×8","7×9","8×8","8×9","6×9","9×9","4×7","4×8","3×7","3×8","6×6"];
const fkey=(a,b)=>`${Math.min(a,b)}×${Math.max(a,b)}`;
const fact=k=>(S.facts[k]||(S.facts[k]={box:0,seen:0,wrong:0}));
function weakList(){return Object.entries(S.facts||{}).filter(([k,f])=>f.seen&&f.box<=2).sort((a,b)=>a[1].box-b[1].box||b[1].wrong-a[1].wrong).map(([k])=>k);}
function buildSet(cfg){
  const cand=new Set();
  cfg.tables.forEach(a=>{for(let b=2;b<=10;b++)cand.add(fkey(a,b));});
  if(cfg.core) CORE.forEach(k=>cand.add(k));
  if(cfg.weak) weakList().forEach(k=>cand.add(k));
  const W=k=>{const f=S.facts[k];let w=!f||!f.seen?3:[6,6,4,2,1,.5][Math.min(f.box,5)];if(CORE.includes(k))w*=1.5;if(k.startsWith("2×")||k.endsWith("×10"))w*=.4;return w;};
  const pool=[...cand], out=[], target=Math.min(cfg.setSize||6,pool.length);
  while(out.length<target){
    const tot=pool.reduce((a,k)=>a+W(k),0); let r=Math.random()*tot, i=0;
    for(;i<pool.length-1;i++){r-=W(pool[i]);if(r<=0)break;}
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function spNext(){
  const sp=view.sp; sp.redo.forEach(r=>r.wait--);
  let k; const due=sp.redo.findIndex(r=>r.wait<=0);
  if(due>=0) k=sp.redo.splice(due,1)[0].k;
  else{ const opts=sp.set.filter(x=>x!==sp.last); k=opts[Math.floor(Math.random()*opts.length)]; }
  const [a,b]=k.split("×").map(Number), sw=Math.random()<.5;
  sp.task={k,a:sw?b:a,b:sw?a:b,ans:a*b,t0:performance.now(),miss:false}; sp.last=k; sp.entry="";
}
function startSpeed(cfg){ view.sp={state:"ready",cfg,correct:0,set:buildSet(cfg),redo:[],flag:new Set(),last:null}; }
function renderSpeed(cfg,n){
  if(!view.sp||view.sp.cfg!==cfg) startSpeed(cfg);
  const sp=view.sp, inStory=!!n;
  const header=inStory?`${head(n,"Speed")}<p>${esc(n.text)}</p>`:`<div class="label">Training · Detektiv ${esc(S.name)}</div><h2>Rechen-Training</h2><p>Hier kommen deine kniffligen Malaufgaben. Was du falsch oder langsam rechnest, kommt öfter wieder. Was schnell sitzt, kommt seltener.</p>`;
  let body="";
  if(sp.state==="ready"){
    body=`<div class="question">Schaffe ${cfg.goal} richtige Antworten in ${cfg.secs} Sekunden. Du musst nicht auf Prüfen tippen: Sobald die Zahl stimmt, kommt die nächste Aufgabe.</div>
     <div><div class="label">Diese Aufgaben kommen dran</div><p style="margin:6px 0 0">${sp.set.map(k=>`<span class="chip">${k}</span>`).join(" ")}</p></div>
     <button class="big" id="spgo">Los!</button>`;
  } else if(sp.state==="run"){
    body=`<div class="spbar"><div class="spfill" id="spfill"></div></div>
     <div class="spstat"><span id="spcount">✓ ${sp.correct} / ${cfg.goal}</span><span id="sptime">${cfg.secs} s</span></div>
     <div class="answer-row"><span class="task" id="sptask">${sp.task.a} × ${sp.task.b} =</span><div class="display empty" id="disp">?</div></div>
     <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-sk="${d}">${d}</button>`).join("")}<button class="key del" data-sk="del" aria-label="Löschen">⌫</button><button class="key" data-sk="0">0</button></div>
     <div class="feedback" id="fb" aria-live="polite"></div>`;
  } else {
    const won=sp.state==="won", flags=[...sp.flag];
    body=`<p class="feedback ${won?"good":"bad"}">${esc(won?(inStory?n.win:"Geschafft!"):(inStory?n.lose:"Die Zeit ist um."))} ${won?"★".repeat(sp.stars):""}</p>
     <p>${sp.correct} richtige Antworten${won?` in ${sp.used} Sekunden`:""}.</p>
     ${flags.length?`<div><div class="label">Merkliste: diese Aufgaben kommen öfter wieder</div><p style="margin:6px 0 0">${flags.map(k=>`<span class="chip hot">${k} = ${k.split("×").reduce((x,y)=>x*y,1)}</span>`).join(" ")}</p></div>`:`<p>Keine Aufgabe auf der Merkliste. Stark!</p>`}
     ${won&&inStory?`<p><b>Notiz:</b> ${esc(n.clue)}</p><button class="big" id="spnext">Weiter</button>`:`<button class="big" id="spretry">${won?"Nochmal trainieren":"Nochmal versuchen"}</button>`}`;
  }
  app.innerHTML=bar()+`<article class="file">${header}${body}</article>`;
  view.spCtx={cfg,n};
  if(sp.state==="ready") document.getElementById("spgo").onclick=()=>{sp.state="run";spNext();sp.tStart=performance.now();renderSpeed(cfg,n);spTick(cfg);};
  else if(sp.state==="run") app.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>spPress(b.dataset.sk));
  else if(document.getElementById("spnext")) document.getElementById("spnext").onclick=()=>go(n.next);
  else document.getElementById("spretry").onclick=()=>{startSpeed(cfg);renderSpeed(cfg,n);};
}
function spTick(cfg){
  if(window.spTimer) clearInterval(window.spTimer);
  window.spTimer=setInterval(()=>{
    const sp=view.sp; if(!sp||sp.state!=="run"){clearInterval(window.spTimer);window.spTimer=null;return;}
    const left=Math.max(0,cfg.secs-(performance.now()-sp.tStart)/1000);
    const f=document.getElementById("spfill"), t=document.getElementById("sptime");
    if(f){f.style.width=(left/cfg.secs*100)+"%";f.classList.toggle("low",left<10);} if(t) t.textContent=Math.ceil(left)+" s";
    if(left<=0) spEnd(false);
  },100);
}
function spEnd(won){
  const sp=view.sp; clearInterval(window.spTimer); window.spTimer=null;
  sp.state=won?"won":"lost"; sp.used=Math.round((performance.now()-sp.tStart)/1000);
  if(won){const rest=1-sp.used/sp.cfg.secs; sp.stars=rest>=.33?3:rest>=.15?2:1; if(view.spCtx.n) award(sp.stars,view.spCtx.n.clue);}
  save(); renderSpeed(view.spCtx.cfg,view.spCtx.n);
}
function spShowTask(){const sp=view.sp,d=document.getElementById("disp");document.getElementById("sptask").textContent=`${sp.task.a} × ${sp.task.b} =`;d.textContent="?";d.classList.add("empty");}
function spPress(k){
  const sp=view.sp; if(!sp||sp.state!=="run"||sp.lock) return;
  const d=document.getElementById("disp"), fb=document.getElementById("fb");
  if(k==="del") sp.entry=sp.entry.slice(0,-1); else if(sp.entry.length<3) sp.entry+=k;
  d.textContent=sp.entry||"?"; d.classList.toggle("empty",!sp.entry); d.classList.remove("shake");
  const ans=String(sp.task.ans);
  if(sp.entry.length<ans.length) return;
  const f=fact(sp.task.k), dt=(performance.now()-sp.task.t0)/1000;
  if(sp.entry===ans){
    f.seen++;
    if(dt<=4) f.box=Math.min(5,f.box+1);
    else if(dt>7){ f.box=Math.max(1,f.box-1); sp.flag.add(sp.task.k); sp.redo.push({k:sp.task.k,wait:3}); }
    else if(f.box===0) f.box=1;
    sp.correct++; document.getElementById("spcount").textContent=`✓ ${sp.correct} / ${sp.cfg.goal}`;
    fb.className="feedback good"; fb.textContent=dt<=4?"Blitzschnell!":dt>7?"Richtig, aber langsam. Die kommt nochmal.":"Richtig!";
    if(sp.correct>=sp.cfg.goal) return spEnd(true);
    spNext(); spShowTask();
  } else {
    f.seen++; f.wrong++; f.box=1; sp.flag.add(sp.task.k); sp.redo.push({k:sp.task.k,wait:2});
    fb.className="feedback bad"; fb.textContent=`${sp.task.a} × ${sp.task.b} = ${ans}. Merk sie dir, sie kommt gleich wieder!`;
    sp.entry=""; void d.offsetWidth; d.classList.add("shake"); sp.lock=true;
    setTimeout(()=>{ sp.lock=false; if(view.sp===sp&&sp.state==="run"){ spNext(); spShowTask(); } },1300);
  }
  save();
}
const TRAIN={secs:60, goal:15, tables:[3,4,6,7,8,9], core:true, weak:true, setSize:8};
function renderTraining(){ renderSpeed(TRAIN,null); }

/* Kampf */
function startBattle(){ view.b={hp:3,hits:0,msg:"",over:null,last:""}; newTask(); entry=""; }
function newTask(){
  const n=node(); let t;
  do{
    const a=rnd(n.tables), b=2+Math.floor(Math.random()*9);
    const div=n.gen==="div"||(n.gen==="mix"&&Math.random()<.4);
    t=div?{txt:`${a*b} : ${a}`,ans:b,d:[a*b,a]}:(Math.random()<.5?{txt:`${a} × ${b}`,ans:a*b}:{txt:`${b} × ${a}`,ans:a*b});
  }while(t.txt===view.b.last);
  view.b.task=t; view.b.last=t.txt;
}
function renderBattle(){
  const n=node(), b=view.b;
  const hearts=[0,1,2].map(i=>i<b.hp?"♥":"<i>♥</i>").join("");
  const foe=Array.from({length:n.hits},(_,i)=>`<span class="${i<b.hits?"gone":""}"></span>`).join("");
  let body;
  if(b.over==="win") body=`<p class="feedback good">${esc(n.win)} ${"★".repeat(b.hp)}</p><p><b>Notiz:</b> ${esc(n.clue)}</p><button class="big" id="bnext">Weiter</button>`;
  else if(b.over==="lose") body=`<p class="feedback bad">${esc(n.lose)}</p><button class="big" id="bretry">Nochmal kämpfen</button>`;
  else body=`<div class="question" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Aufgabe ${b.hits+1} von ${n.hits}</span></div>
     ${b.task.d?shareHtml(b.task.d[0],b.task.d[1],null,"Gruppen"):""}
     <div class="answer-row"><span class="task">${b.task.txt} =</span><div class="display empty" id="disp" aria-live="polite">?</div></div>
     ${padHtml()}<div class="feedback ${b.msgCls||""}" id="fb" aria-live="polite">${esc(b.msg)}</div>`;
  app.innerHTML=bar()+`<article class="file">${head(n,"Kampf")}<p>${esc(n.text)}</p>
   <div class="arena"><div class="fighter"><span class="who">Euer Team</span><span class="hearts" aria-label="${b.hp} Herzen">${hearts}</span></div>
   <div class="fighter"><span class="who">${esc(n.foe)}</span><div class="foebar" aria-label="${n.hits-b.hits} übrig">${foe}</div></div></div>
   ${body}</article>`;
  if(b.over==="win") document.getElementById("bnext").onclick=()=>go(n.next);
  else if(b.over==="lose") document.getElementById("bretry").onclick=()=>{startBattle();renderBattle();};
  else app.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>press(x.dataset.k));
}
function battleAnswer(val){
  const n=node(), b=view.b; entry="";
  if(Number(val)===b.task.ans){
    b.hits++; b.msg=rnd(n.hitLines); b.msgCls="good";
    if(b.hits>=n.hits){ b.over="win"; award(b.hp,n.clue); } else newTask();
  }else{
    b.hp--; b.msg=`${n.missLine} (${b.task.txt} = ${b.task.ans})`; b.msgCls="bad";
    if(b.hp<=0) b.over="lose"; else newTask();
  }
  renderBattle();
  if(b.msgCls==="bad"&&!b.over){const d=document.getElementById("disp"); d&&d.classList.add("shake");}
}

function renderOutro(){
  const c=CHAPTERS[view.ch], cs=caseOf(view.ch), last=view.ch===CASES[cs].to;
  app.innerHTML=bar()+`<article class="file"><div class="stamp">Gelöst</div><div class="label">Fall ${cs+1} · Kapitel ${view.ch-CASES[cs].from+1} abgeschlossen · ★ ${chStars(view.ch)}</div>
   <h2>${esc(c.title)}</h2><p>${esc(c.outro)}</p>
   <p style="color:var(--muted)">Tipp für später: Spiel das Kapitel nochmal und nimm den anderen Weg. Dort warten andere Rätsel.</p>
   <button class="big" id="go">${last?"Zur Urkunde":"Nächstes Kapitel"}</button></article>`;
  document.getElementById("go").onclick=()=>{ if(last){view={screen:"end",cs};render();window.scrollTo(0,0);} else {view={screen:"node",ch:view.ch+1}; go(resumeId(view.ch));} };
}

function renderEnd(){
  const ci=view.cs??0, cs=CASES[ci];
  let t=0; for(let i=cs.from;i<=cs.to;i++) t+=chStars(i);
  const rank=t>=45?"Meisterdetektiv":t>=30?"Oberdetektiv":"Detektiv";
  const next=CASES[ci+1];
  app.innerHTML=bar()+`<article class="file certificate"><div class="label">Urkunde · Fall ${ci+1}</div><div class="seal">★</div>
   <h2>${esc(S.name)} ist ${rank}!</h2>
   <p>Das Detektivbüro Leuchtfeuer bestätigt: „${esc(cs.title)}“ ist gelöst. ${esc(cs.done)}</p>
   <div class="starline">★ ${t}</div>
   <p>Ab 30 Sternen in diesem Fall wirst du Oberdetektiv, ab 45 Meisterdetektiv. Die gibt es nur, wenn du auch die anderen Wege spielst.</p>
   ${next?`<button class="big" id="nextcase" style="align-self:center">Nächster Fall: ${esc(next.title)}</button>`:""}
   <button class="ghost" data-act="title" style="align-self:center;color:var(--ink);border-color:var(--ink)">Zur Fallauswahl</button></article>`;
  const nb=document.getElementById("nextcase");
  if(nb) nb.onclick=()=>{view={screen:"map",cs:ci+1};render();window.scrollTo(0,0);};
}

function openNotes(){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="notebook" role="dialog" aria-label="Notizbuch"><div class="label">Notizbuch von ${esc(S.name||"dir")}</div><h2>Spuren & Hinweise</h2>
   ${S.clues.length?`<ol>${S.clues.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`:'<p class="empty">Noch keine Hinweise. Löse ein Rätsel!</p>'}
   <button class="small" id="closeN" style="align-self:flex-start">Schließen</button></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)close();});
  ov.querySelector("#closeN").onclick=close; ov.querySelector("#closeN").focus();
}

let resetArmed=false;
app.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="notes") openNotes();
  else if(act==="title"){view={screen:"title"};render();window.scrollTo(0,0);}
  else if(act==="end"){view={screen:"end"};render();}
  else if(act==="reset"){
    if(!resetArmed){resetArmed=true;a.textContent="Wirklich alles löschen? Nochmal tippen";a.style.opacity=1;setTimeout(()=>{resetArmed=false;if(a.isConnected){a.textContent="Neues Spiel beginnen";a.style.opacity=.7}},4000);return;}
    S={name:"",stars:{},clues:[],pos:{},done:{},facts:{}};save();resetArmed=false;view={screen:"title"};render();
  }
});

render();
</script>
